<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Mahjong Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050b14, #020408);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(to bottom, #112233, #0a111a);
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 1rem;
            margin-bottom: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            color: #e0f2fe;
        }

        .scoreboard {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            justify-content: space-around;
            color: #7dd3fc;
        }

        /* Profesyonel Üst Toplama Tepsisi */
        .match-tray {
            display: flex;
            justify-content: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #0ea5e9;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 6px;
            width: 100%;
            max-width: 420px;
            min-height: 52px;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(14, 165, 233, 0.4);
        }

        .tray-slot {
            width: 40px;
            height: 46px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Oyun Tahtası Alanı */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            flex: 1;
            min-height: 380px;
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            border: 4px solid #0f172a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            overflow: hidden;
            margin-bottom: 6px;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.75);
            z-index: 1;
        }

        /* Kusursuz 3D Mahjong Taşları */
        .tile {
            position: absolute;
            width: 13.5%;
            height: 11.5%;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 60%, #cbd5e1 100%);
            border-radius: 6px;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 3px solid #475569;
            border-bottom: 6px solid #1e293b;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            z-index: 2;
        }

        .tile:hover:not(.locked) {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.6);
        }

        .tile.selected {
            border-right-color: #0ea5e9;
            border-bottom-color: #0369a1;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 60%, #bbf7d0 100%);
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(14, 165, 233, 0.8);
        }

        .tile.locked {
            background: linear-gradient(135deg, #334155 0%, #1e293b 60%, #0f172a 100%);
            border-top-color: #475569;
            border-left-color: #475569;
            border-right-color: #020617;
            border-bottom-color: #000000;
            cursor: not-allowed;
            filter: brightness(0.65);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-icon {
            font-size: 1.35rem;
            line-height: 1;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
        }

        /* Kombo Bildirim Yazısı */
        .combo-popup {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 1.5rem;
            font-weight: 900;
            color: #fde047;
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.9);
            z-index: 50;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
        }
        .combo-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Alt Buton Paneli */
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            margin-bottom: 4px;
        }

        button.btn {
            background: linear-gradient(to bottom, #0284c7, #0369a1);
            color: white;
            border: 1px solid #38bdf8;
            padding: 6px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            flex: 1;
            text-align: center;
        }

        button.btn.action-btn {
            background: linear-gradient(to bottom, #9333ea, #6b21a8);
            flex: 0 0 38px;
            height: 34px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-color: #c084fc;
        }

        button.btn.powerup-btn {
            background: linear-gradient(to bottom, #f97316, #c2410c);
            border-color: #fdba74;
        }

        button.btn:disabled {
            background: #1e293b;
            border-color: #334155;
            cursor: not-allowed;
            opacity: 0.4;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 100;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: linear-gradient(145deg, #0f172a, #020617);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #38bdf8;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 35px rgba(56, 189, 248, 0.4);
        }

        .modal-content h2 {
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .quote-box {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #bae6fd;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 3px solid #f97316;
        }

        .modal-score {
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: #7dd3fc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galactic Mahjong Pro</h1>
        <div class="scoreboard">
            <div>Sistem: <span id="levelDisplay">1</span>/50</div>
            <div>Skor: <span id="score">0</span></div>
            <div>Zaman: <span id="timer">03:00</span></div>
        </div>
    </header>

    <div class="match-tray" id="matchTray">
        <div class="tray-slot"></div>
        <div class="tray-slot"></div>
        <div class="tray-slot"></div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="combo-popup" id="comboPopup">Harika! 🔥</div>
    </div>

    <div class="controls">
        <button class="btn action-btn" id="undoBtn" title="Geri Al">↩</button>
        <button class="btn" id="shuffleBtn">Karıştır (<span id="shuffleCount">5</span>)</button>
        <button class="btn powerup-btn" id="bombBtn">Bomba (<span id="bombCount">2</span>)</button>
        <button class="btn" id="hintBtn">İpucu</button>
        <button class="btn" id="restartBtn" style="flex: 0 0 45px; background:#1e293b; border-color:#475569;">🔄</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Sistem Temizlendi!</h2>
            <div class="quote-box" id="quoteText">"Kozmik zihnin sınırlarını aştın..."</div>
            <div class="modal-score" id="modalText">Skor: 0</div>
            <button class="btn" id="nextLevelBtn" style="width:100%; padding:8px;">Sonraki Galaksiye Geç</button>
        </div>
    </div>

    <script>
        const spaceSymbols = [
            { id: 1, icon: "🌍", name: "Dünya" },
            { id: 2, icon: "🪐", name: "Satürn" },
            { id: 3, icon: "🔴", name: "Mars" },
            { id: 4, icon: "🌕", name: "Ay" },
            { id: 5, icon: "☀️", name: "Güneş" },
            { id: 6, icon: "🌀", name: "Galaksi" },
            { id: 7, icon: "💫", name: "Pulsar" },
            { id: 8, icon: "☄️", name: "Kuyruklu Yıldız" },
            { id: 9, icon: "🕳️", name: "Kara Delik" },
            { id: 10, icon: "🛸", name: "UFO" },
            { id: 11, icon: "⭐", name: "Süpernova" },
            { id: 12, icon: "🚀", name: "Roket" }
        ];

        const galaxyQuotes = [
            "\"Kozmos içimizdedir; evreni keşfetmek, kendi içimizi keşfetmektir.\"",
            "\"Yıldızlararası yolculuk, en keskin zihinlerin tozlu raflarından başlar.\"",
            "\"Zaman ve uzay bükülür, ancak doğru eşleşme her zaman yolu bulur.\""
        ];

        let currentLevel = 1;
        let score = 0;
        let tiles = [];
        let selectedTile = null;
        let gameActive = true;
        let shuffleUses = 5;
        let bombUses = 2;
        let timeLeft = 180;
        let timerInterval = null;
        let moveHistory = [];
        let comboCount = 0;

        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timer');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const bombBtn = document.getElementById('bombBtn');
        const hintBtn = document.getElementById('hintBtn');
        const undoBtn = document.getElementById('undoBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shuffleCountSpan = document.getElementById('shuffleCount');
        const bombCountSpan = document.getElementById('bombCount');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const quoteText = document.getElementById('quoteText');
        const modalText = document.getElementById('modalText');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const matchTray = document.getElementById('matchTray');
        const comboPopup = document.getElementById('comboPopup');

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 180;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("Kozmik Süre Tükendi!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let secs = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function initLevel() {
            gameContainer.querySelectorAll('.tile').forEach(t => t.remove());
            matchTray.innerHTML = '<div class="tray-slot"></div><div class="tray-slot"></div><div class="tray-slot"></div>';
            selectedTile = null;
            gameActive = true;
            modal.style.display = 'none';
            levelDisplay.textContent = currentLevel;
            shuffleUses = 5;
            bombUses = 2;
            moveHistory = [];
            comboCount = 0;
            updatePowerupState();
            startTimer();

            let pairCount = Math.min(18, 8 + Math.floor((currentLevel - 1) / 2) * 2);
            let poolCopy = [...spaceSymbols];
            while (poolCopy.length < pairCount) {
                poolCopy = poolCopy.concat(spaceSymbols);
            }
            poolCopy.sort(() => Math.random() - 0.5);
            let selectedPool = poolCopy.slice(0, pairCount);

            let totalTiles = selectedPool.concat(selectedPool);
            totalTiles.sort(() => Math.random() - 0.5);

            let tilePairs = totalTiles.map((sym, index) => ({
                uuid: Math.random() + "_" + index,
                symbolId: sym.id,
                icon: sym.icon,
                name: sym.name
            }));

            let positions = generateAdvancedLayout(tilePairs.length);
            tiles = tilePairs.map((item, index) => ({
                ...item,
                x: positions[index].x,
                y: positions[index].y,
                layer: positions[index].layer,
                removed: false
            }));

            renderTiles();
        }

        function generateAdvancedLayout(count) {
            let posList = [];
            // Profesyonel katmanlı pyramid/galaksi yapısı
            for (let i = 0; i < count; i++) {
                let layer = i < count * 0.4 ? 0 : (i < count * 0.75 ? 1 : 2);
                let offsetX = (layer * 3) + (Math.sin(i) * 4);
                let offsetY = (layer * 3) + (Math.cos(i) * 4);
                let x = 25 + ((i % 5) * 11) + offsetX;
                let y = 18 + (Math.floor(i / 5) * 13) + offsetY;
                posList.push({ 
                    x: Math.max(5, Math.min(80, x)), 
                    y: Math.max(5, Math.min(78, y)), 
                    layer 
                });
            }
            return posList;
        }

        function isTileLocked(tile) {
            if (tile.removed) return true;
            return tiles.some(other => {
                if (other.removed || other.layer <= tile.layer) return false;
                return Math.abs(other.x - tile.x) < 9 && Math.abs(other.y - tile.y) < 10;
            });
        }

        function renderTiles() {
            const existingTiles = gameContainer.querySelectorAll('.tile');
            existingTiles.forEach(t => t.remove());

            let sortedTiles = [...tiles].sort((a, b) => a.layer - b.layer);

            sortedTiles.forEach(tile => {
                if (tile.removed) return;
                const el = document.createElement('div');
                el.className = 'tile';
                el.style.left = `${tile.x}%`;
                el.style.top = `${tile.y}%`;
                el.style.zIndex = (tile.layer * 10) + 2;

                const locked = isTileLocked(tile);
                if (locked) el.classList.add('locked');
                if (selectedTile && selectedTile.uuid === tile.uuid) el.classList.add('selected');

                el.innerHTML = `<div class="tile-inner"><span class="tile-icon">${tile.icon}</span></div>`;

                if (!locked) {
                    el.addEventListener('click', () => handleTileClick(tile));
                }
                gameContainer.appendChild(el);
            });
        }

        function handleTileClick(tile) {
            if (!gameActive) return;

            moveHistory.push({ type: 'select', tileUuid: tile.uuid, prevSelected: selectedTile ? selectedTile.uuid : null });

            if (selectedTile) {
                if (selectedTile.uuid === tile.uuid) {
                    selectedTile = null;
                } else if (selectedTile.symbolId === tile.symbolId) {
                    comboCount++;
                    showComboEffect(comboCount);
                    updateMatchTray(selectedTile, tile);
                    selectedTile.removed = true;
                    tile.removed = true;
                    selectedTile = null;
                    score += 30 + (comboCount * 5);
                    scoreDisplay.textContent = score;
                    checkWinCondition();
                } else {
                    selectedTile = tile;
                    comboCount = 0;
                }
            } else {
                selectedTile = tile;
                comboCount = 0;
            }
            renderTiles();
        }

        function showComboEffect(combo) {
            if (combo < 2) return;
            comboPopup.textContent = `Kombo x${combo}! 🔥`;
            comboPopup.classList.add('show');
            setTimeout(() => {
                comboPopup.classList.remove('show');
            }, 600);
        }

        function updateMatchTray(t1, t2) {
            matchTray.innerHTML = `
                <div class="tray-slot"><div class="tile" style="position:relative; width:100%; height:100%;"><span class="tile-icon">${t1.icon}</span></div></div>
                <div class="tray-slot"><div class="tile" style="position:relative; width:100%; height:100%;"><span class="tile-icon">${t2.icon}</span></div></div>
                <div class="tray-slot"></div>
            `;
            setTimeout(() => {
                matchTray.innerHTML = '<div class="tray-slot"></div><div class="tray-slot"></div><div class="tray-slot"></div>';
            }, 550);
        }

        undoBtn.addEventListener('click', () => {
            if (moveHistory.length === 0 || !gameActive) return;
            let lastMove = moveHistory.pop();
            tiles.forEach(t => {
                if (t.uuid === lastMove.tileUuid) t.removed = false;
            });
            selectedTile = lastMove.prevSelected ? (tiles.find(t => t.uuid === lastMove.prevSelected) || null) : null;
            renderTiles();
        });

        bombBtn.addEventListener('click', () => {
            if (!gameActive || bombUses <= 0) return;
            let activeTiles = tiles.filter(t => !t.removed && !isTileLocked(t));
            if (activeTiles.length < 2) return;
            
            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].symbolId === activeTiles[j].symbolId) {
                        bombUses--;
                        updatePowerupState();
                        updateMatchTray(activeTiles[i], activeTiles[j]);
                        activeTiles[i].removed = true;
                        activeTiles[j].removed = true;
                        selectedTile = null;
                        score += 60;
                        scoreDisplay.textContent = score;
                        renderTiles();
                        checkWinCondition();
                        return;
                    }
                }
            }
            alert("Patlatılacak uygun eşleşme bulunamadı!");
        });

        shuffleBtn.addEventListener('click', () => {
            if (!gameActive || shuffleUses <= 0) return;
            shuffleUses--;
            updatePowerupState();
            let activeTiles = tiles.filter(t => !t.removed);
            let symbolsList = activeTiles.map(t => ({ id: t.symbolId, icon: t.icon, name: t.name }));
            symbolsList.sort(() => Math.random() - 0.5);
            activeTiles.forEach((t, i) => {
                t.symbolId = symbolsList[i].id;
                t.icon = symbolsList[i].icon;
                t.name = symbolsList[i].name;
            });
            selectedTile = null;
            renderTiles();
        });

        hintBtn.addEventListener('click', () => {
            if (!gameActive) return;
            let activeTiles = tiles.filter(t => !t.removed && !isTileLocked(t));
            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].symbolId === activeTiles[j].symbolId) {
                        selectedTile = activeTiles[i];
                        renderTiles();
                        return;
                    }
                }
            }
            alert("Açıkta eşleşen taş yok, karıştırmayı kullan!");
        });

        function checkWinCondition() {
            let remaining = tiles.filter(t => !t.removed).length;
            if (remaining === 0) {
                gameActive = false;
                clearInterval(timerInterval);
                quoteText.textContent = galaxyQuotes[(currentLevel - 1) % galaxyQuotes.length];
                modalTitle.textContent = `Galaksi ${currentLevel} Temizlendi!`;
                modalText.textContent = `Kozmik Skor: ${score}`;
                modal.style.display = 'flex';
            }
        }

        function gameOver(msg) {
            gameActive = false;
            modalTitle.textContent = "Görev Başarısız!";
            quoteText.textContent = "\"Yıldızlar tozdan doğar, tekrar dene kaşif!\"";
            modalText.textContent = msg;
            nextLevelBtn.textContent = "Yeniden Dene";
            nextLevelBtn.onclick = () => initLevel();
            modal.style.display = 'flex';
        }

        restartBtn.addEventListener('click', () => {
            if (confirm("Bu galaksi görevini yeniden başlatmak istiyor musun?")) {
                initLevel();
            }
        });

        function updatePowerupState() {
            shuffleCountSpan.textContent = shuffleUses;
            bombCountSpan.textContent = bombUses;
            shuffleBtn.disabled = (shuffleUses <= 0);
            bombBtn.disabled = (bombUses <= 0);
        }

        nextLevelBtn.addEventListener('click', () => {
            if (currentLevel < 50) {
                currentLevel++;
                nextLevelBtn.textContent = "Sonraki Galaksiye Geç";
                nextLevelBtn.onclick = () => initLevel();
                initLevel();
            } else {
                currentLevel = 1;
                score = 0;
                initLevel();
            }
        });

        initLevel();
    </script>
</body>
</html>
