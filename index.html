<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Eşleştirme Oyunu - Zen Manzaraları</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f251a, #1b4332);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }

        header {
            text-align: center;
            margin-bottom: 6px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .scoreboard {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            justify-content: space-around;
            backdrop-filter: blur(4px);
        }

        /* Arka plan manzarası ve cam efekti eklenmiş oyun alanı */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 380px;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            border: 2px solid #52b788;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            overflow: hidden;
            margin-bottom: 10px;
            transition: background-image 0.5s ease-in-out;
        }

        /* Taşların rahat okunması için hafif karartma katmanı */
        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 30, 20, 0.65);
            z-index: 1;
        }

        .tile {
            position: absolute;
            width: 14%;
            height: 19%;
            background: #f4f1de;
            color: #2b2b2b;
            border-radius: 5px;
            border: 1.5px solid #d4d0c7;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 2px 1px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, background-color 0.2s;
            z-index: 2; /* Karartma katmanının üstünde kalır */
        }

        .tile:hover:not(.locked) {
            transform: translateY(-2px);
            background: #fff;
        }

        .tile.selected {
            border-color: #e76f51;
            background: #faedcd;
            transform: translateY(-3px);
            box-shadow: 0 5px 8px rgba(231, 111, 81, 0.5);
        }

        .tile.locked {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            filter: brightness(0.7);
        }

        .tile-number {
            font-size: 0.5rem;
            font-weight: bold;
            color: #e76f51;
        }

        .tile-icon {
            font-size: 1rem;
        }

        .tile-label {
            font-size: 0.45rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #40916c;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 380px;
        }

        button.btn {
            background-color: #52b788;
            color: white;
            border: none;
            padding: 7px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            flex: 1;
        }

        button.btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(145deg, #1b4332, #0f251a);
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            border: 2px solid #52b788;
            max-width: 330px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-bottom: 8px;
            font-size: 1.2rem;
            color: #52b788;
        }

        /* Estetik Hafıza Sözleri Tasarımı */
        .quote-box {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e9edc9;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            border-left: 3px solid #e76f51;
        }

        .modal-score {
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #a3b18a;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mahjong Eşleştirme</h1>
        <div class="scoreboard">
            <div>Seviye: <span id="levelDisplay">1</span>/100</div>
            <div>Skor: <span id="score">0</span></div>
            <div>Süre: <span id="timer">03:00</span></div>
        </div>
    </header>

    <div class="game-container" id="gameContainer"></div>

    <div class="controls">
        <button class="btn" id="shuffleBtn">Karıştır (<span id="shuffleCount">10</span>)</button>
        <button class="btn" id="hintBtn">İpucu (<span id="hintCount">10</span>)</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Tebrikler!</h2>
            <div class="quote-box" id="quoteText">"Zihin kasları gibidir; ne kadar çok çalıştırırsanız, o kadar güçlenir."</div>
            <div class="modal-score" id="modalText">Skor: 0</div>
            <button class="btn" id="nextLevelBtn">Sonraki Seviye</button>
        </div>
    </div>

    <script>
        // Göz yormayan, yüksek kaliteli ve şık manzaraların listesi (Unsplash görsel havuzu)
        const wallpapers = [
            "https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=600&auto=format&fit=crop", // Orman yaprakları yeşil
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop", // Sakin huzurlu sahil/doğa
            "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600&auto=format&fit=crop", // Sisli orman manzarası
            "https://images.unsplash.com/photo-1511497584788-876761142212?q=80&w=600&auto=format&fit=crop", // Bambu yeşil doğa
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=600&auto=format&fit=crop"  // Dağ ve doğa manzarası
        ];

        // Her seviye bitişi için hafıza ve zihin konulu estetik özlü sözler
        const memoryQuotes = [
            "\"Zihin, kaslar gibidir; ne kadar çok çalıştırırsanız, o kadar güçlenir ve keskinleşir.\"",
            "\"Güçlü bir hafıza, geçmişin tecrübesiyle bugünün farkındalığını birleştiren en büyük hazinedir.\"",
            "\"Bulmacalar ve zihin egzersizleri, beynin gizli kalmış yollarını aydınlatan birer meşaledir.\"",
            "\"Öğrenmek ve hatırlamak, beynimizin bize sunduğu en güzel mucizelerden biridir.\"",
            "\"Her bulmaca çözümü, zihinsel bahçemizde açan yeni ve taze bir çiçek gibidir.\"",
            "\"Odaklanma yeteneği, dikkati yönetebilme ve anı yakalayabilme sanatıdır.\"",
            "\"Zihinsel aktif kalmak, yaş sınırı tanımayan en keyifli ve dinamik yaşam tarzıdır.\"",
            "\"Küçük adımlar ve düzenli egzersizler, hafızada büyük ve kalıcı izler bırakır.\"",
            "\"Her eşleşen parça, zihninizdeki karmaşayı düzenleyen huzurlu bir adımdır.\"",
            "\"Bilgi ve hafıza, paylaştıkça ve kullandıkça parlayan nadide mücevherlerdir.\""
        ];

        const normalSymbols = [
            { id: 1, icon: "⭐", label: "Yıldız" },
            { id: 2, icon: "🌙", label: "Ay" },
            { id: 3, icon: "🔥", label: "Ateş" },
            { id: 4, icon: "💧", label: "Su" },
            { id: 5, icon: "🍀", label: "Yonca" },
            { id: 6, icon: "💎", label: "Elmas" },
            { id: 7, icon: "⚡", label: "Yıldırım" },
            { id: 8, icon: "🍎", label: "Elma" },
            { id: 9, icon: "🌸", label: "Çiçek" },
            { id: 10, icon: "🎵", label: "Nota" },
            { id: 11, icon: "🚀", label: "Roket" },
            { id: 12, icon: "🎯", label: "Hedef" },
            { id: 13, icon: "👑", label: "Taç" },
            { id: 14, icon: "🎨", label: "Palet" },
            { id: 15, icon: "🔮", label: "Küre" },
            { id: 16, icon: "🦋", label: "Kelebek" },
            { id: 17, icon: "🍕", label: "Pizza" },
            { id: 18, icon: "🌵", label: "Kaktüs" }
        ];

        const bonusSymbols = [
            { id: 101, icon: "🛸", label: "Ufo" },
            { id: 102, icon: "👾", label: "Uzaylı" },
            { id: 103, icon: "🪐", label: "Satürn" },
            { id: 104, icon: "🤖", label: "Robot" },
            { id: 105, icon: "🧬", label: "DNA" },
            { id: 106, icon: "🧪", label: "İksir" },
            { id: 107, icon: "💻", label: "Laptop" },
            { id: 108, icon: "⚡", label: "Enerji" },
            { id: 109, icon: "🔭", label: "Teleskop" },
            { id: 110, icon: "⚙️", label: "Dişli" },
            { id: 111, icon: "💡", label: "Ampul" },
            { id: 112, icon: "🛰️", label: "Uydu" }
        ];

        let currentLevel = 1;
        let score = 0;
        let tiles = [];
        let selectedTile = null;
        let gameActive = true;
        let shuffleUses = 10;
        let hintUses = 10;
        let timeLeft = 180;
        let timerInterval = null;

        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timer');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const hintBtn = document.getElementById('hintBtn');
        const shuffleCountSpan = document.getElementById('shuffleCount');
        const hintCountSpan = document.getElementById('hintCount');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const quoteText = document.getElementById('quoteText');
        const modalText = document.getElementById('modalText');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        function setBackgroundWallpaper() {
            let bgIndex = (currentLevel - 1) % wallpapers.length;
            gameContainer.style.backgroundImage = `url('${wallpapers[bgIndex]}')`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 180;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("Süre bitti!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let secs = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function initLevel() {
            gameContainer.innerHTML = '';
            selectedTile = null;
            gameActive = true;
            modal.style.display = 'none';
            levelDisplay.textContent = currentLevel;
            shuffleUses = 10;
            hintUses = 10;
            updateButtonsState();
            setBackgroundWallpaper();
            startTimer();

            let pairCount;
            if (currentLevel <= 10) {
                pairCount = 4 + (currentLevel - 1) * 2;
            } else {
                pairCount = Math.min(20, 18 + Math.floor((currentLevel - 10) / 5) * 2);
            }

            let isBonusLevel = (currentLevel % 10 === 0);
            let activePool = isBonusLevel ? bonusSymbols : normalSymbols;

            let poolCopy = [...activePool];
            while (poolCopy.length < pairCount) {
                poolCopy = poolCopy.concat(activePool);
            }
            poolCopy.sort(() => Math.random() - 0.5);
            let selectedPool = poolCopy.slice(0, pairCount);

            let tilePairs = [];
            let totalTiles = selectedPool.concat(selectedPool);
            totalTiles.sort(() => Math.random() - 0.5);

            totalTiles.forEach((sym, index) => {
                tilePairs.push({
                    uuid: Math.random() + "_" + index,
                    symbolId: sym.id,
                    icon: sym.icon,
                    label: sym.label,
                    number: index + 1
                });
            });

            let positions = generateGeometricLayout(tilePairs.length, currentLevel);

            tiles = tilePairs.map((item, index) => ({
                ...item,
                x: positions[index].x,
                y: positions[index].y,
                layer: positions[index].layer,
                removed: false
            }));

            renderTiles();
        }

        function generateGeometricLayout(count, level) {
            let posList = [];
            let shapeType = level % 4;

            for (let i = 0; i < count; i++) {
                let x = 35, y = 35, layer = 0;

                if (shapeType === 0) {
                    layer = i < count * 0.4 ? 0 : (i < count * 0.8 ? 1 : 2);
                    let row = Math.floor(Math.sqrt(i * 2));
                    let col = i - (row * (row + 1)) / 2;
                    x = 25 + (row * 4) + (col * 11);
                    y = 15 + (row * 14) + (layer * 3);
                } 
                else if (shapeType === 1) {
                    layer = i % 3;
                    let angle = (i / count) * Math.PI * 2;
                    let radius = 25 - (layer * 5);
                    x = 42 + Math.cos(angle) * radius;
                    y = 40 + Math.sin(angle) * (radius * 0.8);
                } 
                else if (shapeType === 2) {
                    layer = Math.floor(i / 14);
                    let localIdx = i % 14;
                    let col = localIdx % 5;
                    let row = Math.floor(localIdx / 5);
                    x = 15 + (col * 14) + (layer * 4);
                    y = 20 + (row * 14) + (layer * 4);
                } 
                else {
                    layer = i < count / 2 ? 0 : 1;
                    let t = (i % (count / 2)) / (count / 2) * Math.PI * 2;
                    x = 40 + Math.sin(t) * 25;
                    y = 40 + Math.cos(t) * 20 + (layer * 4);
                }

                x = Math.max(2, Math.min(82, x));
                y = Math.max(5, Math.min(78, y));

                posList.push({ x, y, layer });
            }
            return posList;
        }

        function isTileLocked(tile) {
            if (tile.removed) return true;
            return tiles.some(other => {
                if (other.removed || other.layer <= tile.layer) return false;
                return Math.abs(other.x - tile.x) < 9 && Math.abs(other.y - tile.y) < 12;
            });
        }

        function renderTiles() {
            // Eski taşları temizle ama arka plan katmanını koru
            const existingTiles = gameContainer.querySelectorAll('.tile');
            existingTiles.forEach(t => t.remove());

            let sortedTiles = [...tiles].sort((a, b) => a.layer - b.layer);

            sortedTiles.forEach(tile => {
                if (tile.removed) return;
                const el = document.createElement('div');
                el.className = 'tile';
                el.style.left = `${tile.x}%`;
                el.style.top = `${tile.y}%`;
                el.style.zIndex = (tile.layer * 10) + 2;

                const locked = isTileLocked(tile);
                if (locked) el.classList.add('locked');
                if (selectedTile && selectedTile.uuid === tile.uuid) el.classList.add('selected');

                el.innerHTML = `
                    <span class="tile-number">#${tile.number}</span>
                    <span class="tile-icon">${tile.icon}</span>
                    <span class="tile-label">${tile.label}</span>
                `;

                if (!locked) {
                    el.addEventListener('click', () => handleTileClick(tile));
                }
                gameContainer.appendChild(el);
            });
        }

        function handleTileClick(tile) {
            if (!gameActive) return;
            if (selectedTile) {
                if (selectedTile.uuid === tile.uuid) {
                    selectedTile = null;
                } else if (selectedTile.symbolId === tile.symbolId) {
                    selectedTile.removed = true;
                    tile.removed = true;
                    selectedTile = null;
                    score += 15;
                    scoreDisplay.textContent = score;
                    checkWinCondition();
                } else {
                    selectedTile = tile;
                }
            } else {
                selectedTile = tile;
            }
            renderTiles();
        }

        function checkWinCondition() {
            let remaining = tiles.filter(t => !t.removed).length;
            if (remaining === 0) {
                gameActive = false;
                clearInterval(timerInterval);
                
                // Rastgele veya sıradan bir hafıza sözü seç
                let randomQuote = memoryQuotes[(currentLevel - 1) % memoryQuotes.length];
                quoteText.textContent = randomQuote;

                if (currentLevel >= 100) {
                    modalTitle.textContent = "🏆 Tebrikler!";
                    modalText.textContent = `100 Seviyeyi Tamamladın! Toplam Skor: ${score}`;
                    nextLevelBtn.style.display = 'none';
                } else {
                    modalTitle.textContent = currentLevel % 10 === 0 ? "🌟 Bonus Seviye Tamamlandı!" : `Seviye ${currentLevel} Tamamlandı!`;
                    modalText.textContent = `Güncel Skor: ${score}`;
                    nextLevelBtn.style.display = 'inline-block';
                }
                modal.style.display = 'flex';
            }
        }

        function gameOver(msg) {
            gameActive = false;
            modalTitle.textContent = "Süre Bitti!";
            quoteText.textContent = "\"Unutmayın, her deneme zihninizi bir sonraki zafer için daha da güçlendirir.\"";
            modalText.textContent = msg;
            nextLevelBtn.textContent = "Tekrar Dene";
            nextLevelBtn.onclick = () => initLevel();
            modal.style.display = 'flex';
        }

        shuffleBtn.addEventListener('click', () => {
            if (!gameActive || shuffleUses <= 0) return;
            shuffleUses--;
            updateButtonsState();
            let activeTiles = tiles.filter(t => !t.removed);
            let symbolsList = activeTiles.map(t => ({ id: t.symbolId, icon: t.icon, label: t.label }));
            symbolsList.sort(() => Math.random() - 0.5);
            activeTiles.forEach((t, i) => {
                t.symbolId = symbolsList[i].id;
                t.icon = symbolsList[i].icon;
                t.label = symbolsList[i].label;
            });
            selectedTile = null;
            renderTiles();
        });

        hintBtn.addEventListener('click', () => {
            if (!gameActive || hintUses <= 0) return;
            let activeTiles = tiles.filter(t => !t.removed && !isTileLocked(t));
            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].symbolId === activeTiles[j].symbolId) {
                        hintUses--;
                        updateButtonsState();
                        selectedTile = activeTiles[i];
                        renderTiles();
                        return;
                    }
                }
            }
            alert("Açıkta eşleşen taş kalmadı, karıştırmayı dene!");
        });

        function updateButtonsState() {
            shuffleCountSpan.textContent = shuffleUses;
            hintCountSpan.textContent = hintUses;
            shuffleBtn.disabled = (shuffleUses <= 0);
            hintBtn.disabled = (hintUses <= 0);
        }

        nextLevelBtn.addEventListener('click', () => {
            if (currentLevel < 100) {
                currentLevel++;
                nextLevelBtn.textContent = "Sonraki Seviye";
                nextLevelBtn.onclick = () => initLevel();
                initLevel();
            } else {
                currentLevel = 1;
                score = 0;
                initLevel();
            }
        });

        initLevel();
    </script>
</body>
</html>
