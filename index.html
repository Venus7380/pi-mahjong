<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Master Venüs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f251a, #1b4332);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
            width: 100%;
            max-width: 100%;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .scoreboard {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            justify-content: space-around;
            backdrop-filter: blur(4px);
            margin-bottom: 6px;
        }

        .game-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 420px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            border: 2px solid #52b788;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            overflow: hidden;
            margin-bottom: 8px;
            transition: background-image 0.5s ease-in-out;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 30, 20, 0.65);
            z-index: 1;
        }

        /* Gönderdiğin görseldeki gibi kalın kırmızı duvarlı ve 3D kavisli Mahjong Taşı Tasarımı */
        .tile {
            position: absolute;
            width: 13.5%;
            height: 16%;
            /* Üst yüzey kemik rengi, alt/yan kısımları temsil eden belirgin kalın 3D çerçeve */
            background: linear-gradient(135deg, #fffff8 0%, #f7f3e3 60%, #e6dfc7 100%);
            border-radius: 8px;
            /* Görseldeki gibi kalın kırmızı/bordo alt-yan duvar efekti ve içten yumuşak iç gölge */
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 4px solid #b32d2d;
            border-bottom: 6px solid #8a1c1c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.65), 0 3px 6px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.2s;
            z-index: 2;
        }

        .tile:hover:not(.locked) {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.75), 0 4px 8px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,255,255,0.9);
        }

        .tile.selected {
            border-right-color: #e76f51;
            border-bottom-color: #bc3908;
            background: linear-gradient(135deg, #fffcf0 0%, #faedcd 60%, #f5dbb3 100%);
            transform: translateY(-5px);
            box-shadow: 0 14px 22px rgba(231, 111, 81, 0.65), 0 4px 8px rgba(0,0,0,0.4);
        }

        .tile.locked {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 60%, #94a3b8 100%);
            border-top-color: #f1f5f9;
            border-left-color: #f1f5f9;
            border-right-color: #475569;
            border-bottom-color: #334155;
            cursor: not-allowed;
            filter: brightness(0.85);
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .tile-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, rgba(255,255,255,0.6), rgba(240,235,215,0.8));
            border-radius: 5px;
            border: 1px solid rgba(210, 200, 175, 0.6);
            padding: 1px;
        }

        .tile.locked .tile-content-wrapper {
            background: rgba(200, 205, 215, 0.5);
            border-color: rgba(150, 160, 175, 0.4);
        }

        .tile-icon {
            font-size: 1.1rem;
            font-weight: 900;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
        }

        .tile-label {
            font-size: 0.38rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #555;
            margin-top: 1px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .tile.locked .tile-label {
            color: #64748b;
        }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        button.btn {
            background-color: #52b788;
            color: white;
            border: none;
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            flex: 1;
        }

        button.btn.restart-btn {
            background-color: #e76f51;
        }

        button.btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(145deg, #1b4332, #0f251a);
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            border: 2px solid #52b788;
            max-width: 330px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            margin-bottom: 8px;
            font-size: 1.2rem;
            color: #52b788;
        }

        .quote-box {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e9edc9;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            border-left: 3px solid #e76f51;
        }

        .modal-score {
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #a3b18a;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mahjong Master Venüs</h1>
        <div class="scoreboard">
            <div>Seviye: <span id="levelDisplay">1</span>/100</div>
            <div>Skor: <span id="score">0</span></div>
            <div>Süre: <span id="timer">03:00</span></div>
        </div>
    </header>

    <div class="game-container" id="gameContainer"></div>

    <div class="controls">
        <button class="btn" id="shuffleBtn">Karıştır (<span id="shuffleCount">10</span>)</button>
        <button class="btn" id="hintBtn">İpucu (<span id="hintCount">10</span>)</button>
        <button class="btn restart-btn" id="restartBtn">Yeniden Başlat</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Tebrikler!</h2>
            <div class="quote-box" id="quoteText">"Zihin kasları gibidir; ne kadar çok çalıştırırsanız, o kadar güçlenir."</div>
            <div class="modal-score" id="modalText">Skor: 0</div>
            <button class="btn" id="nextLevelBtn">Sonraki Seviye</button>
        </div>
    </div>

    <script>
        const wallpapers = [
            "https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1511497584788-876761142212?q=80&w=600&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=600&auto=format&fit=crop"
        ];

        const memoryQuotes = [
            "\"Zihin, kaslar gibidir; ne kadar çok çalıştırırsanız, o kadar güçlenir ve keskinleşir.\"",
            "\"Güçlü bir hafıza, geçmişin tecrübesiyle bugünün farkındalığını birleştiren en büyük hazinedir.\"",
            "\"Bulmacalar ve zihin egzersizleri, beynin gizli kalmış yollarını aydınlatan birer meşaledir.\"",
            "\"Öğrenmek ve hatırlamak, beynimizin bize sunduğu en güzel mucizelerden biridir.\"",
            "\"Her bulmaca çözümü, zihinsel bahçemizde açan yeni ve taze bir çiçek gibidir.\"",
            "\"Odaklanma yeteneği, dikkati yönetebilme ve anı yakalayabilme sanatıdır.\"",
            "\"Zihinsel aktif kalmak, yaş sınırı tanımayan en keyifli ve dinamik yaşam tarzıdır.\"",
            "\"Küçük adımlar ve düzenli egzersizler, hafızada büyük ve kalıcı izler bırakır.\"",
            "\"Her eşleşen parça, zihninizdeki karmaşayı düzenleyen huzurlu bir adımdır.\"",
            "\"Bilgi ve hafıza, paylaştıkça ve kullandıkça parlayan nadide mücevherlerdir.\""
        ];

        /* Görseldeki estetiğe uygun klasik Çin / Asya motifleri ve renk tonları */
        const normalSymbols = [
            { id: 1, icon: "🀄", label: "Orta", color: "#c0392b" },
            { id: 2, icon: "🀆", label: "Ejder", color: "#2980b9" },
            { id: 3, icon: "🀅", label: "Yeşil", color: "#27ae60" },
            { id: 4, icon: "🀇", label: "Bir", color: "#c0392b" },
            { id: 5, icon: "🀈", label: "İki", color: "#2980b9" },
            { id: 6, icon: "🀉", label: "Üç", color: "#27ae60" },
            { id: 7, icon: "🀊", label: "Dört", color: "#d35400" },
            { id: 8, icon: "🀋", label: "Beş", color: "#8e44ad" },
            { id: 9, icon: "🀌", label: "Altı", color: "#16a085" },
            { id: 10, icon: "🀍", label: "Yedi", color: "#c0392b" },
            { id: 11, icon: "🀎", label: "Sekiz", color: "#2980b9" },
            { id: 12, icon: "🀏", label: "Dokuz", color: "#27ae60" },
            { id: 13, icon: "🀙", label: "Daire 1", color: "#2980b9" },
            { id: 14, icon: "🀚", label: "Daire 2", color: "#c0392b" },
            { id: 15, icon: "🀛", label: "Daire 3", color: "#27ae60" },
            { id: 16, icon: "🀜", label: "Daire 4", color: "#d35400" },
            { id: 17, icon: "🀝", label: "Daire 5", color: "#8e44ad" },
            { id: 18, icon: "🀞", label: "Daire 6", color: "#16a085" }
        ];

        const bonusSymbols = [
            { id: 101, icon: "🀀", label: "Doğu", color: "#c0392b" },
            { id: 102, icon: "🀁", label: "Güney", color: "#2980b9" },
            { id: 103, icon: "🀂", label: "Batı", color: "#27ae60" },
            { id: 104, icon: "🀃", label: "Kuzey", color: "#d35400" },
            { id: 105, icon: "🀟", label: "Daire 7", color: "#c0392b" },
            { id: 106, icon: "🀠", label: "Daire 8", color: "#2980b9" },
            { id: 107, icon: "🀡", label: "Daire 9", color: "#27ae60" },
            { id: 108, icon: "🀢", label: "Bambu 1", color: "#27ae60" },
            { id: 109, icon: "🀣", label: "Bambu 2", color: "#2980b9" },
            { id: 110, icon: "🀤", label: "Bambu 3", color: "#c0392b" },
            { id: 111, icon: "🀥", label: "Bambu 4", color: "#d35400" },
            { id: 112, icon: "🀦", label: "Bambu 5", color: "#8e44ad" }
        ];

        let currentLevel = 1;
        let score = 0;
        let tiles = [];
        let selectedTile = null;
        let gameActive = true;
        let shuffleUses = 10;
        let hintUses = 10;
        let timeLeft = 180;
        let timerInterval = null;

        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('levelDisplay');
        const timerDisplay = document.getElementById('timer');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const hintBtn = document.getElementById('hintBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shuffleCountSpan = document.getElementById('shuffleCount');
        const hintCountSpan = document.getElementById('hintCount');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const quoteText = document.getElementById('quoteText');
        const modalText = document.getElementById('modalText');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        function setBackgroundWallpaper() {
            let bgIndex = (currentLevel - 1) % wallpapers.length;
            gameContainer.style.backgroundImage = `url('${wallpapers[bgIndex]}')`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 180;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver("Süre bitti!");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let secs = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function initLevel() {
            gameContainer.innerHTML = '';
            selectedTile = null;
            gameActive = true;
            modal.style.display = 'none';
            levelDisplay.textContent = currentLevel;
            shuffleUses = 10;
            hintUses = 10;
            updateButtonsState();
            setBackgroundWallpaper();
            startTimer();

            let pairCount;
            if (currentLevel <= 10) {
                pairCount = 4 + (currentLevel - 1) * 2;
            } else {
                pairCount = Math.min(20, 18 + Math.floor((currentLevel - 10) / 5) * 2);
            }

            let isBonusLevel = (currentLevel % 10 === 0);
            let activePool = isBonusLevel ? bonusSymbols : normalSymbols;

            let poolCopy = [...activePool];
            while (poolCopy.length < pairCount) {
                poolCopy = poolCopy.concat(activePool);
            }
            poolCopy.sort(() => Math.random() - 0.5);
            let selectedPool = poolCopy.slice(0, pairCount);

            let tilePairs = [];
            let totalTiles = selectedPool.concat(selectedPool);
            totalTiles.sort(() => Math.random() - 0.5);

            totalTiles.forEach((sym, index) => {
                tilePairs.push({
                    uuid: Math.random() + "_" + index,
                    symbolId: sym.id,
                    icon: sym.icon,
                    label: sym.label,
                    color: sym.color,
                    number: index + 1
                });
            });

            let positions = generateBalancedLayout(tilePairs.length, currentLevel);

            tiles = tilePairs.map((item, index) => ({
                ...item,
                x: positions[index].x,
                y: positions[index].y,
                layer: positions[index].layer,
                removed: false
            }));

            renderTiles();
        }

        function generateBalancedLayout(count, level) {
            let posList = [];
            let shapeType = level % 4;

            for (let i = 0; i < count; i++) {
                let x = 35, y = 35, layer = 0;

                if (shapeType === 0) {
                    layer = i < count * 0.5 ? 0 : (i < count * 0.85 ? 1 : 2);
                    let row = Math.floor(Math.sqrt(i * 1.5));
                    let col = i - (row * row);
                    x = 15 + (row * 3) + (col * 12);
                    y = 12 + (row * 14) + (layer * 2);
                } 
                else if (shapeType === 1) {
                    layer = i % 2;
                    let angle = (i / count) * Math.PI * 2;
                    let radius = 28 - (layer * 4);
                    x = 42 + Math.cos(angle) * radius;
                    y = 40 + Math.sin(angle) * (radius * 0.75);
                } 
                else if (shapeType === 2) {
                    layer = Math.floor(i / 16);
                    let localIdx = i % 16;
                    let col = localIdx % 6;
                    let row = Math.floor(localIdx / 6);
                    x = 10 + (col * 13.5) + (layer * 3);
                    y = 12 + (row * 16) + (layer * 3);
                } 
                else {
                    layer = i < count / 2 ? 0 : 1;
                    let t = (i % (count / 2)) / (count / 2) * Math.PI * 2;
                    x = 42 + Math.sin(t) * 30;
                    y = 42 + Math.cos(t) * 24 + (layer * 3);
                }

                x = Math.max(2, Math.min(84, x));
                y = Math.max(3, Math.min(80, y));

                posList.push({ x, y, layer });
            }
            return posList;
        }

        function isTileLocked(tile) {
            if (tile.removed) return true;
            return tiles.some(other => {
                if (other.removed || other.layer <= tile.layer) return false;
                return Math.abs(other.x - tile.x) < 8.5 && Math.abs(other.y - tile.y) < 11;
            });
        }

        function renderTiles() {
            const existingTiles = gameContainer.querySelectorAll('.tile');
            existingTiles.forEach(t => t.remove());

            let sortedTiles = [...tiles].sort((a, b) => a.layer - b.layer);

            sortedTiles.forEach(tile => {
                if (tile.removed) return;
                const el = document.createElement('div');
                el.className = 'tile';
                el.style.left = `${tile.x}%`;
                el.style.top = `${tile.y}%`;
                el.style.zIndex = (tile.layer * 10) + 2;

                const locked = isTileLocked(tile);
                if (locked) el.classList.add('locked');
                if (selectedTile && selectedTile.uuid === tile.uuid) el.classList.add('selected');

                el.innerHTML = `
                    <div class="tile-content-wrapper">
                        <span class="tile-icon" style="color: ${locked ? '#64748b' : tile.color};">${tile.icon}</span>
                        <span class="tile-label">${tile.label}</span>
                    </div>
                `;

                if (!locked) {
                    el.addEventListener('click', () => handleTileClick(tile));
                }
                gameContainer.appendChild(el);
            });
        }

        function handleTileClick(tile) {
            if (!gameActive) return;
            if (selectedTile) {
                if (selectedTile.uuid === tile.uuid) {
                    selectedTile = null;
                } else if (selectedTile.symbolId === tile.symbolId) {
                    selectedTile.removed = true;
                    tile.removed = true;
                    selectedTile = null;
                    score += 15;
                    scoreDisplay.textContent = score;
                    checkWinCondition();
                } else {
                    selectedTile = tile;
                }
            } else {
                selectedTile = tile;
            }
            renderTiles();
        }

        function checkWinCondition() {
            let remaining = tiles.filter(t => !t.removed).length;
            if (remaining === 0) {
                gameActive = false;
                clearInterval(timerInterval);
                
                let randomQuote = memoryQuotes[(currentLevel - 1) % memoryQuotes.length];
                quoteText.textContent = randomQuote;

                if (currentLevel >= 100) {
                    modalTitle.textContent = "🏆 Tebrikler!";
                    modalText.textContent = `100 Seviyeyi Tamamladın! Toplam Skor: ${score}`;
                    nextLevelBtn.style.display = 'none';
                } else {
                    modalTitle.textContent = currentLevel % 10 === 0 ? "🌟 Bonus Seviye Tamamlandı!" : `Seviye ${currentLevel} Tamamlandı!`;
                    modalText.textContent = `Güncel Skor: ${score}`;
                    nextLevelBtn.style.display = 'inline-block';
                }
                modal.style.display = 'flex';
            }
        }

        function gameOver(msg) {
            gameActive = false;
            modalTitle.textContent = "Süre Bitti!";
            quoteText.textContent = "\"Unutmayın, her deneme zihninizi bir sonraki zafer için daha da güçlendirir.\"";
            modalText.textContent = msg;
            nextLevelBtn.textContent = "Tekrar Dene";
            nextLevelBtn.onclick = () => initLevel();
            modal.style.display = 'flex';
        }

        shuffleBtn.addEventListener('click', () => {
            if (!gameActive || shuffleUses <= 0) return;
            shuffleUses--;
            updateButtonsState();
            let activeTiles = tiles.filter(t => !t.removed);
            let symbolsList = activeTiles.map(t => ({ id: t.symbolId, icon: t.icon, label: t.label, color: t.color }));
            symbolsList.sort(() => Math.random() - 0.5);
            activeTiles.forEach((t, i) => {
                t.symbolId = symbolsList[i].id;
                t.icon = symbolsList[i].icon;
                t.label = symbolsList[i].label;
                t.color = symbolsList[i].color;
            });
            selectedTile = null;
            renderTiles();
        });

        hintBtn.addEventListener('click', () => {
            if (!gameActive || hintUses <= 0) return;
            let activeTiles = tiles.filter(t => !t.removed && !isTileLocked(t));
            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].symbolId === activeTiles[j].symbolId) {
                        hintUses--;
                        updateButtonsState();
                        selectedTile = activeTiles[i];
                        renderTiles();
                        return;
                    }
                }
            }
            alert("Açıkta eşleşen taş kalmadı, karıştırmayı dene!");
        });

        restartBtn.addEventListener('click', () => {
            if (confirm("Bu seviyeyi baştan başlatmak istiyor musun?")) {
                initLevel();
            }
        });

        function updateButtonsState() {
            shuffleCountSpan.textContent = shuffleUses;
            hintCountSpan.textContent = hintUses;
            shuffleBtn.disabled = (shuffleUses <= 0);
            hintBtn.disabled = (hintUses <= 0);
        }

        nextLevelBtn.addEventListener('click', () => {
            if (currentLevel < 100) {
                currentLevel++;
                nextLevelBtn.textContent = "Sonraki Seviye";
                nextLevelBtn.onclick = () => initLevel();
                initLevel();
            } else {
                currentLevel = 1;
                score = 0;
                initLevel();
            }
        });

        initLevel();
    </script>
</body>
</html>
