<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venüs</title>
    <style>
        :root {
            --tile-w: 42px;
            --tile-h: 60px;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            padding: 5px;
            background: radial-gradient(circle, #1a4d2e 0%, #081c11 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
            width: 100%;
            max-width: 380px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 35, 20, 0.9);
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid rgba(241, 196, 15, 0.4);
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .stats-item span {
            color: #f1c40f;
            font-size: 12px;
        }

        .board-wrapper {
            position: relative;
            width: 350px;
            height: 380px;
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 3px solid rgba(241, 196, 15, 0.3);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
        }

        .tile {
            position: absolute;
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #eaeaea);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
            box-sizing: border-box;
            border: 1px solid #dcdcdc;
        }

        .tile-inner {
            width: 82%;
            height: 86%;
            border: 2px solid #dedede;
            border-radius: 4px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.06);
        }

        .tile .symbol-text {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .tile .symbol-sub {
            font-size: 7px;
            margin-top: 2px;
            font-weight: bold;
            opacity: 0.85;
        }

        /* Katman Derinlikleri */
        .tile[data-layer="0"] { z-index: 10; box-shadow: 2px 3px 5px var(--shadow-color), 0 3px 0 #b0bec5; }
        .tile[data-layer="1"] { z-index: 20; box-shadow: 4px 5px 8px var(--shadow-color), 0 4px 0 #90a4ae; }
        .tile[data-layer="2"] { z-index: 30; box-shadow: 6px 8px 12px var(--shadow-color), 0 5px 0 #78909c; }

        .tile.blocked {
            filter: brightness(0.45) grayscale(0.5);
            cursor: not-allowed;
        }

        .tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 15px #f1c40f, 0 5px 0 #d4ac0d !important;
            transform: translateY(-5px) scale(1.05);
            z-index: 99 !important;
        }

        .tile.hint-target {
            animation: pulseHint 0.6s infinite alternate;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 15px #2ecc71 !important;
        }

        @keyframes pulseHint {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .tile.matched {
            opacity: 0;
            transform: scale(0) rotate(15deg) !important;
            pointer-events: none;
        }

        .controls {
            margin-top: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            background: linear-gradient(145deg, #27ae60, #1e8449);
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .circle-btn:active {
            transform: scale(0.92);
        }

        .btn-text {
            font-size: 10px;
            margin-top: 3px;
            color: #f1c40f;
            font-weight: bold;
        }

        #urgentAlert {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.8);
            z-index: 150;
            text-align: center;
            border: 2px solid #fff;
            width: 75%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal h2 {
            color: #f1c40f;
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal p {
            font-size: 12px;
            margin: 5px 0 15px 0;
            color: #ecf0f1;
            text-align: center;
            line-height: 1.4;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid #f1c40f;
            padding: 8px 12px;
            border-radius: 4px;
            font-style: italic;
            margin-bottom: 12px;
            max-width: 280px;
            font-size: 11px;
        }

        .btn-main {
            background: linear-gradient(180deg, #f1c40f 0%, #d4ac0d 100%);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">🀄 MAHJONG MASTER VENÜS 🀄</div>
        <div class="stats-bar">
            <div class="stats-item">Seviye: <span id="level">1</span>/50</div>
            <div class="stats-item">Puan: <span id="score">0</span></div>
            <div class="stats-item">Süre: <span id="timer">120</span>s</div>
            <div class="stats-item">Kalan: <span id="remaining">0</span></div>
        </div>
    </header>

    <div class="board-wrapper" id="board">
        <div id="urgentAlert">⚠️ DİKKAT! SÜRE BİTİYOR! ⚠️</div>
    </div>

    <div class="controls">
        <div class="action-group">
            <button class="circle-btn" onclick="shuffleTiles()">🔀</button>
            <div class="btn-text">Karıştır (<span id="shuffleCount">10</span>)</div>
        </div>
        <div class="action-group">
            <button class="circle-btn" onclick="showHint()">💡</button>
            <div class="btn-text">İpucu (<span id="hintCount">10</span>)</div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <h2>Bölüm Tamamlandı! 🎉</h2>
        <p id="winMessage">Süre Bonusu Ekleniyor...</p>
        <div class="quote-box" id="quoteText">"Hafıza, zekanın hazinesidir."</div>
        <button class="btn-main" onclick="nextLevel()">Sonraki Seviye ➡️</button>
    </div>

    <div class="modal" id="loseModal">
        <h2 id="loseTitle" style="color: #e74c3c;">Süre Bitti! ⏳</h2>
        <p id="loseMessage">Tekrar denemek ister misin?</p>
        <button class="btn-main" onclick="resetCurrentLevel()">Yeniden Başla 🔄</button>
    </div>

    <script>
        // İlk 10 level için 1'den 10'a sayı sembolleri
        const numberSymbols = [
            { main: '1', sub: 'Bir', color: '#c0392b', name: 'Num 1' },
            { main: '2', sub: 'İki', color: '#e67e22', name: 'Num 2' },
            { main: '3', sub: 'Üç', color: '#f1c40f', name: 'Num 3' },
            { main: '4', sub: 'Dört', color: '#27ae60', name: 'Num 4' },
            { main: '5', sub: 'Beş', color: '#2980b9', name: 'Num 5' },
            { main: '6', sub: 'Altı', color: '#8e44ad', name: 'Num 6' },
            { main: '7', sub: 'Yedi', color: '#16a085', name: 'Num 7' },
            { main: '8', sub: 'Sekiz', color: '#d35400', name: 'Num 8' },
            { main: '9', sub: 'Dokuz', color: '#c0392b', name: 'Num 9' },
            { main: '10', sub: 'On', color: '#2c3e50', name: 'Num 10' }
        ];

        const standardSymbols = [
            { main: '中', sub: '萬', color: '#c0392b', name: 'Red Dragon' },
            { main: '發', sub: '萬', color: '#27ae60', name: 'Green Dragon' },
            { main: '東', sub: '風', color: '#c0392b', name: 'East Wind' },
            { main: '南', sub: '風', color: '#2980b9', name: 'South Wind' },
            { main: '西', sub: '風', color: '#27ae60', name: 'West Wind' },
            { main: '北', sub: '風', color: '#d35400', name: 'North Wind' },
            { main: '一', sub: '萬', color: '#27ae60', name: '1 Char' },
            { main: '二', sub: '萬', color: '#c0392b', name: '2 Char' },
            { main: '三', sub: '萬', color: '#8e44ad', name: '3 Char' },
            { main: '四', sub: '萬', color: '#e67e22', name: '4 Char' }
        ];

        const animalSymbols = [
            { main: '🐱', sub: 'Kedi', color: '#e67e22', name: 'Animal Cat' },
            { main: '🐶', sub: 'Köpek', color: '#d35400', name: 'Animal Dog' },
            { main: '🦁', sub: 'Aslan', color: '#f1c40f', name: 'Animal Lion' },
            { main: '🐼', sub: 'Panda', color: '#2c3e50', name: 'Animal Panda' },
            { main: '🐰', sub: 'Tavşan', color: '#e84393', name: 'Animal Rabbit' },
            { main: '🦊', sub: 'Tilki', color: '#e17055', name: 'Animal Fox' }
        ];

        const memoryQuotes = [
            "\"Hafıza, aklın kütüphanesidir; onu düzenli tutmak zihni berraklaştırır.\"",
            "\"Geçmişin izlerini saklayan hafıza, geleceğin en güvenli rehberidir.\"",
            "\"Güçlü bir hafıza, öğrenmenin ve keşfetmenin en sadık dostudur.\"",
            "\"Zihinsel egzersizler, düşünce dünyamıza taze bir nefes kazandırır.\"",
            "\"Her bulmaca çözümü, beyin hücreleri arasında kurulan yeni bir köprüdür.\""
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedTile = null;
        let remainingTiles = 0;
        let tilesData = [];
        let lockBoard = false;
        let timerInterval = null;
        let timeLeft = 120;
        let shuffleLeft = 10;
        let hintLeft = 10;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = Math.max(45, 120 - (currentLevel * 1.2));
            document.getElementById('timer').innerText = Math.floor(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = Math.floor(timeLeft);

                if (timeLeft <= 15 && timeLeft > 0) {
                    document.getElementById('urgentAlert').style.display = 'block';
                } else {
                    document.getElementById('urgentAlert').style.display = 'none';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('urgentAlert').style.display = 'none';
                    document.getElementById('loseTitle').innerText = "Süre Bitti! ⏳";
                    document.getElementById('loseMessage').innerText = "Süren tükendi. Tekrar denemek ister misin?";
                    document.getElementById('loseModal').style.display = 'flex';
                }
            }, 1000);
        }

        // Katmanlı ve garantili yerleşim algoritması
        function generateLayout(levelIdx) {
            let layout = [];
            // İlk 10 level tam 20 taş (10 çift: 1'den 10'a sayılar)
            let totalPairs = (levelIdx < 10) ? 10 : (12 + Math.floor((levelIdx - 10) / 3) * 2);
            if (totalPairs > 24) totalPairs = 24; 
            let totalTiles = totalPairs * 2;

            let startX = 35;
            let startY = 25;
            let stepX = 46;
            let stepY = 64;

            let idx = 0;
            // 3 Katmanlı yapı (Üst üste binme)
            for (let l = 0; l < 3; l++) {
                let rows = 3 - l;
                let cols = 5 - l;
                let lStartX = startX + (l * 20);
                let lStartY = startY + (l * 22);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (idx >= totalTiles) break;
                        layout.push({
                            x: lStartX + (c * stepX),
                            y: lStartY + (r * stepY),
                            l: l
                        });
                        idx++;
                    }
                    if (idx >= totalTiles) break;
                }
                if (idx >= totalTiles) break;
            }

            // Kalan taşları alt katmana güvenli ekle
            while (layout.length < totalTiles) {
                layout.push({
                    x: 25 + ((layout.length * 22) % 250),
                    y: 230 + ((layout.length * 10) % 70),
                    l: 0
                });
            }

            return layout;
        }

        function loadLevel(levelIdx) {
            const board = document.getElementById('board');
            document.getElementById('winModal').style.display = 'none';
            document.getElementById('loseModal').style.display = 'none';
            document.getElementById('urgentAlert').style.display = 'none';
            
            shuffleLeft = 10;
            hintLeft = 10;
            updateControlCounts();

            board.innerHTML = '';
            board.appendChild(document.getElementById('urgentAlert'));
            selectedTile = null;
            lockBoard = false;

            const layout = generateLayout(levelIdx);
            remainingTiles = layout.length;

            // Sembol havuzu seçimi (İlk 10 level 1'den 10'a sayılar)
            let poolToUse;
            if (levelIdx < 10) {
                poolToUse = numberSymbols;
            } else if ((levelIdx + 1) % 10 === 0) {
                poolToUse = animalSymbols;
            } else {
                poolToUse = standardSymbols;
            }

            let activeSymbols = [];
            for (let i = 0; i < layout.length / 2; i++) {
                activeSymbols.push(poolToUse[i % poolToUse.length]);
            }

            let deck = [...activeSymbols, ...activeSymbols];
            deck.sort(() => Math.random() - 0.5);

            tilesData = [];

            layout.forEach((pos, idx) => {
                const sym = deck[idx];
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.id = idx;
                tile.dataset.name = sym.name;
                tile.dataset.layer = pos.l;
                tile.style.left = `${pos.x}px`;
                tile.style.top = `${pos.y}px`;

                tile.innerHTML = `
                    <div class="tile-inner">
                        <div class="symbol-text" style="color: ${sym.color}">${sym.main}</div>
                        <div class="symbol-sub" style="color: ${sym.color}">${sym.sub}</div>
                    </div>
                `;

                board.appendChild(tile);

                tilesData.push({
                    id: idx,
                    element: tile,
                    x: pos.x,
                    y: pos.y,
                    layer: pos.l,
                    matched: false
                });

                tile.addEventListener('click', () => handleTileClick(idx));
            });

            updateBlockedTiles();
            updateStats();
            startTimer();
        }

        // Kilitlenme Kuralı (Üstteki taş alttakini kilitler)
        function updateBlockedTiles() {
            tilesData.forEach(tile => {
                if (tile.matched) return;

                let isBlocked = tilesData.some(other => {
                    if (other.matched) return false;
                    if (other.layer > tile.layer) {
                        let overlapX = Math.abs(other.x - tile.x) < 38;
                        let overlapY = Math.abs(other.y - tile.y) < 52;
                        return overlapX && overlapY;
                    }
                    return false;
                });

                if (isBlocked) {
                    tile.element.classList.add('blocked');
                } else {
                    tile.element.classList.remove('blocked');
                }
            });

            checkGameStuck();
        }

        function checkGameStuck() {
            if (remainingTiles <= 0) return;
            let activeTiles = tilesData.filter(t => !t.matched && !t.element.classList.contains('blocked'));
            let hasPair = false;

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].element.dataset.name === activeTiles[j].element.dataset.name) {
                        hasPair = true;
                        break;
                    }
                }
                if (hasPair) break;
            }

            if (!hasPair) {
                if (shuffleLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('urgentAlert').style.display = 'none';
                    document.getElementById('loseTitle').innerText = "Çözüm Bulunamadı! 🛑";
                    document.getElementById('loseMessage').innerText = "Hamle kalmadı! Bölüm yeniden başlatılıyor.";
                    document.getElementById('loseModal').style.display = 'flex';
                } else {
                    shuffleLeft--;
                    updateControlCounts();
                    autoExecuteShuffle();
                }
            }
        }

        function handleTileClick(id) {
            if (lockBoard) return;
            const tile = tilesData[id];
            
            if (tile.matched || tile.element.classList.contains('blocked')) return;

            tilesData.forEach(t => t.element.classList.remove('hint-target'));

            if (selectedTile === tile) {
                tile.element.classList.remove('selected');
                selectedTile = null;
                return;
            }

            tile.element.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tile;
            } else {
                if (selectedTile.element.dataset.name === tile.element.dataset.name && selectedTile.id !== tile.id) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.add('matched');
                        tile.element.classList.add('matched');
                        selectedTile.matched = true;
                        tile.matched = true;

                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;

                        score += 200;
                        remainingTiles -= 2;

                        updateBlockedTiles();
                        updateStats();
                        lockBoard = false;

                        if (remainingTiles === 0) {
                            clearInterval(timerInterval);
                            document.getElementById('urgentAlert').style.display = 'none';
                            let bonus = Math.floor(timeLeft * 15);
                            score += bonus;
                            updateStats();
                            
                            document.getElementById('winMessage').innerText = `Bölüm Tamamlandı! Süre Bonusu: +${bonus} Puan`;
                            document.getElementById('quoteText').innerText = memoryQuotes[Math.floor(Math.random() * memoryQuotes.length)];
                            document.getElementById('winModal').style.display = 'flex';
                        }
                    }, 200);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                    }, 300);
                }
            }
        }

        function shuffleTiles() {
            if (shuffleLeft <= 0) {
                alert("Karıştırma hakkın kalmadı!");
                return;
            }
            shuffleLeft--;
            updateControlCounts();
            autoExecuteShuffle();
        }

        function autoExecuteShuffle() {
            let activeTiles = tilesData.filter(t => !t.matched);
            if (activeTiles.length === 0) return;

            let currentSymbols = activeTiles.map(t => ({
                name: t.element.dataset.name,
                html: t.element.querySelector('.tile-inner').innerHTML
            }));

            currentSymbols.sort(() => Math.random() - 0.5);

            activeTiles.forEach((tile, idx) => {
                tile.element.dataset.name = currentSymbols[idx].name;
                tile.element.querySelector('.tile-inner').innerHTML = currentSymbols[idx].html;
            });

            if (selectedTile) {
                selectedTile.element.classList.remove('selected');
                selectedTile = null;
            }
            updateBlockedTiles();
        }

        function showHint() {
            if (hintLeft <= 0) {
                alert("İpucu hakkın kalmadı!");
                return;
            }
            hintLeft--;
            updateControlCounts();

            let activeTiles = tilesData.filter(t => !t.matched && !t.element.classList.contains('blocked'));
            let pairFound = null;

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].element.dataset.name === activeTiles[j].element.dataset.name) {
                        pairFound = [activeTiles[i], activeTiles[j]];
                        break;
                    }
                }
                if (pairFound) break;
            }

            if (pairFound) {
                pairFound[0].element.classList.add('hint-target');
                pairFound[1].element.classList.add('hint-target');

                setTimeout(() => {
                    pairFound[0].element.classList.remove('hint-target');
                    pairFound[1].element.classList.remove('hint-target');
                }, 2000);
            } else {
                shuffleTiles();
            }
        }

        function updateControlCounts() {
            document.getElementById('shuffleCount').innerText = shuffleLeft;
            document.getElementById('hintCount').innerText = hintLeft;
        }

        function resetCurrentLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= 50) currentLevel = 0;
            loadLevel(currentLevel);
        }

        function updateStats() {
            document.getElementById('level').innerText = currentLevel + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('remaining').innerText = Math.max(0, remainingTiles);
        }

        loadLevel(currentLevel);
    </script>
</body>
</html>
