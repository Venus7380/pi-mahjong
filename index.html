<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venus</title>
    <style>
        :root {
            --tile-w: 52px;
            --tile-h: 70px;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 10px 5px;
            background: radial-gradient(circle, #1b5e20 0%, #061c0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
        }

        h1 {
            margin: 2px 0;
            color: #ffd700;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            font-weight: bold;
            font-size: 13px;
        }

        .stats-item span {
            color: #ffd700;
        }

        .board-wrapper {
            position: relative;
            width: 350px;
            height: 480px;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* İşaretlenen özel çerçeveli taş stili */
        .tile {
            position: absolute;
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #f4f4f4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-sizing: border-box;
            border: 1px solid #dcdcdc;
        }

        .tile-inner {
            width: 82%;
            height: 86%;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.1);
        }

        .tile .symbol-text {
            font-size: 26px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .tile .symbol-sub {
            font-size: 10px;
            margin-top: 2px;
            font-weight: bold;
            opacity: 0.85;
        }

        /* Katman derinlikleri */
        .tile[data-layer="0"] { z-index: 10; box-shadow: 2px 3px 5px var(--shadow-color), 0 4px 0 #b0bec5; }
        .tile[data-layer="1"] { z-index: 20; box-shadow: 4px 6px 8px var(--shadow-color), 0 5px 0 #90a4ae; transform: translate(-3px, -3px); }
        .tile[data-layer="2"] { z-index: 30; box-shadow: 6px 9px 12px var(--shadow-color), 0 6px 0 #78909c; transform: translate(-6px, -6px); }

        .tile.blocked {
            filter: brightness(0.62) grayscale(0.25);
            cursor: not-allowed;
        }

        .tile.selected {
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px #ffd700, 0 6px 0 #ffb300 !important;
            transform: translate(-3px, -8px) scale(1.05) !important;
            z-index: 99 !important;
        }

        .tile.matched {
            opacity: 0;
            transform: scale(0.2) !important;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(180deg, #ffb300 0%, #ff8f00 100%);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .win-modal h2 {
            color: #ffd700;
            font-size: 30px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mahjong Master</h1>
        <div class="stats-bar">
            <div class="stats-item">Seviye: <span id="level">1</span></div>
            <div class="stats-item">Puan: <span id="score">0</span></div>
            <div class="stats-item">Kalan: <span id="remaining">0</span></div>
        </div>
    </header>

    <div class="board-wrapper" id="board"></div>

    <div class="controls">
        <button class="btn" onclick="resetCurrentLevel()">Yeniden Başlat</button>
    </div>

    <div class="win-modal" id="winModal">
        <h2>Bölüm Tamamlandı! 🎉</h2>
        <p>Tebrikler, bir sonraki seviyeye geçiyorsunuz.</p>
        <button class="btn" onclick="nextLevel()">Sonraki Seviye</button>
    </div>

    <script>
        // Çerçeveli özel Mahjong taş koleksiyonu
        const symbolsPool = [
            { main: '中', sub: '萬', color: '#d32f2f', name: 'Red Dragon' },
            { main: '發', sub: '萬', color: '#2e7d32', name: 'Green Dragon' },
            { main: '東', sub: '風', color: '#d32f2f', name: 'East Wind' },
            { main: '南', sub: '風', color: '#1976d2', name: 'South Wind' },
            { main: '西', sub: '風', color: '#2e7d32', name: 'West Wind' },
            { main: '北', sub: '風', color: '#f57c00', name: 'North Wind' },
            { main: '一', sub: '萬', color: '#2e7d32', name: '1 Character' },
            { main: '二', sub: '萬', color: '#d32f2f', name: '2 Character' },
            { main: '三', sub: '萬', color: '#8e24aa', name: '3 Character' },
            { main: '九', sub: '萬', color: '#00796b', name: '9 Character' }
        ];

        // Daha kavisli ve estetik rakam dizilimleri
        const layouts = [
            // Level 1: Estetik "1" Rakamı
            [
                {x: 120, y: 70, l: 0}, {x: 150, y: 35, l: 0},
                {x: 150, y: 100, l: 0}, {x: 150, y: 165, l: 0}, {x: 150, y: 230, l: 0}, {x: 150, y: 295, l: 0},
                {x: 95, y: 360, l: 0}, {x: 150, y: 360, l: 0}, {x: 205, y: 360, l: 0},
                // Katman 1
                {x: 150, y: 100, l: 1}, {x: 150, y: 165, l: 1}, {x: 150, y: 230, l: 1},
                // Katman 2 (Tepe Noktası)
                {x: 150, y: 165, l: 2}
            ],
            // Level 2: Estetik ve Kavisli "2" Rakamı
            [
                {x: 100, y: 40, l: 0}, {x: 150, y: 30, l: 0}, {x: 200, y: 45, l: 0},
                {x: 210, y: 110, l: 0}, {x: 170, y: 175, l: 0}, {x: 125, y: 240, l: 0},
                {x: 85, y: 305, l: 0}, {x: 85, y: 370, l: 0}, {x: 140, y: 370, l: 0}, {x: 195, y: 370, l: 0},
                // Katman 1
                {x: 150, y: 30, l: 1}, {x: 170, y: 175, l: 1}, {x: 125, y: 240, l: 1}, {x: 140, y: 370, l: 1},
                // Katman 2
                {x: 170, y: 175, l: 2}
            ],
            // Level 3: Kıvrımlı "3" Rakamı
            [
                {x: 100, y: 35, l: 0}, {x: 150, y: 30, l: 0}, {x: 200, y: 45, l: 0},
                {x: 205, y: 110, l: 0}, {x: 155, y: 175, l: 0},
                {x: 205, y: 240, l: 0}, {x: 200, y: 305, l: 0}, {x: 150, y: 360, l: 0}, {x: 100, y: 350, l: 0},
                // Katman 1
                {x: 150, y: 30, l: 1}, {x: 155, y: 175, l: 1}, {x: 205, y: 240, l: 1}, {x: 150, y: 360, l: 1},
                // Katman 2
                {x: 155, y: 175, l: 2}
            ],
            // Level 4: "4" Rakamı
            [
                {x: 180, y: 30, l: 0}, {x: 135, y: 85, l: 0}, {x: 90, y: 145, l: 0},
                {x: 65, y: 210, l: 0}, {x: 120, y: 210, l: 0}, {x: 175, y: 210, l: 0}, {x: 230, y: 210, l: 0},
                {x: 175, y: 110, l: 0}, {x: 175, y: 275, l: 0}, {x: 175, y: 340, l: 0},
                // Katman 1
                {x: 135, y: 85, l: 1}, {x: 175, y: 210, l: 1}, {x: 175, y: 275, l: 1},
                // Katman 2
                {x: 175, y: 210, l: 2}
            ]
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedTile = null;
        let remainingTiles = 0;
        let tilesData = [];
        let lockBoard = false;

        function loadLevel(levelIdx) {
            const board = document.getElementById('board');
            document.getElementById('winModal').style.display = 'none';
            board.innerHTML = '';
            selectedTile = null;
            lockBoard = false;

            const layout = layouts[levelIdx % layouts.length];
            remainingTiles = layout.length;

            let pairsCount = Math.floor(layout.length / 2);
            let activeSymbols = symbolsPool.slice(0, Math.min(pairsCount, symbolsPool.length));
            while (activeSymbols.length < pairsCount) {
                activeSymbols = activeSymbols.concat(symbolsPool.slice(0, pairsCount - activeSymbols.length));
            }

            let deck = [...activeSymbols, ...activeSymbols];
            if (layout.length % 2 !== 0) {
                deck.push(symbolsPool[0]);
            }
            deck.sort(() => Math.random() - 0.5);

            tilesData = [];

            layout.forEach((pos, idx) => {
                const sym = deck[idx];
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.id = idx;
                tile.dataset.name = sym.name;
                tile.dataset.layer = pos.l;
                tile.style.left = `${pos.x}px`;
                tile.style.top = `${pos.y}px`;

                tile.innerHTML = `
                    <div class="tile-inner">
                        <div class="symbol-text" style="color: ${sym.color}">${sym.main}</div>
                        <div class="symbol-sub" style="color: ${sym.color}">${sym.sub}</div>
                    </div>
                `;

                board.appendChild(tile);

                tilesData.push({
                    id: idx,
                    element: tile,
                    x: pos.x,
                    y: pos.y,
                    layer: pos.l,
                    matched: false
                });

                tile.addEventListener('click', () => handleTileClick(idx));
            });

            updateBlockedTiles();
            updateStats();
        }

        function updateBlockedTiles() {
            tilesData.forEach(tile => {
                if (tile.matched) return;

                let isBlocked = tilesData.some(other => {
                    if (other.matched) return false;
                    if (other.layer > tile.layer) {
                        let overlapX = Math.abs(other.x - tile.x) < 40;
                        let overlapY = Math.abs(other.y - tile.y) < 52;
                        return overlapX && overlapY;
                    }
                    return false;
                });

                if (isBlocked) {
                    tile.element.classList.add('blocked');
                } else {
                    tile.element.classList.remove('blocked');
                }
            });
        }

        function handleTileClick(id) {
            if (lockBoard) return;
            const tile = tilesData[id];
            
            if (tile.matched || tile.element.classList.contains('blocked')) return;

            if (selectedTile === tile) {
                tile.element.classList.remove('selected');
                selectedTile = null;
                return;
            }

            tile.element.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tile;
            } else {
                if (selectedTile.element.dataset.name === tile.element.dataset.name) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.add('matched');
                        tile.element.classList.add('matched');
                        selectedTile.matched = true;
                        tile.matched = true;

                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;

                        score += 150;
                        remainingTiles -= 2;

                        updateBlockedTiles();
                        updateStats();
                        lockBoard = false;

                        if (remainingTiles <= 1) {
                            document.getElementById('winModal').style.display = 'flex';
                        }
                    }, 250);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                    }, 400);
                }
            }
        }

        function resetCurrentLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            loadLevel(currentLevel);
        }

        function updateStats() {
            document.getElementById('level').innerText = currentLevel + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('remaining').innerText = Math.max(0, remainingTiles);
        }

        loadLevel(currentLevel);
    </script>
</body>
</html>
