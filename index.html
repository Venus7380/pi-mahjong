<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venüs</title>
    <style>
        :root {
            --tile-w: 48px;
            --tile-h: 66px;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            padding: 5px;
            background: radial-gradient(circle, #1a4d2e 0%, #081c11 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2px;
            width: 100%;
            max-width: 380px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 35, 20, 0.9);
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid rgba(241, 196, 15, 0.4);
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .stats-item span {
            color: #f1c40f;
            font-size: 12px;
        }

        .board-wrapper {
            position: relative;
            width: 360px;
            height: 410px;
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 15px;
            border: 3px solid rgba(241, 196, 15, 0.25);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .tile {
            position: absolute;
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.25s ease;
            box-sizing: border-box;
            border: 1px solid #dcdcdc;
        }

        .tile-inner {
            width: 82%;
            height: 86%;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.08);
        }

        .tile .symbol-text {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .tile .symbol-sub {
            font-size: 9px;
            margin-top: 2px;
            font-weight: bold;
            opacity: 0.85;
        }

        .tile[data-layer="0"] { z-index: 10; box-shadow: 2px 3px 5px var(--shadow-color), 0 4px 0 #b0bec5; }
        .tile[data-layer="1"] { z-index: 20; box-shadow: 4px 6px 8px var(--shadow-color), 0 5px 0 #90a4ae; transform: translate(-2px, -2px); }
        .tile[data-layer="2"] { z-index: 30; box-shadow: 6px 9px 12px var(--shadow-color), 0 6px 0 #78909c; transform: translate(-4px, -4px); }

        .tile.blocked {
            filter: brightness(0.55) grayscale(0.3);
            cursor: not-allowed;
        }

        .tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 20px #f1c40f, 0 6px 0 #d4ac0d !important;
            transform: translate(-3px, -8px) scale(1.06) !important;
            z-index: 99 !important;
        }

        .tile.hint-target {
            animation: pulseHint 0.6s infinite alternate;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 18px #2ecc71 !important;
        }

        @keyframes pulseHint {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .tile.matched {
            opacity: 0;
            transform: scale(0.0) rotate(15deg) !important;
            pointer-events: none;
        }

        .controls {
            margin-top: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            background: linear-gradient(145deg, #27ae60, #1e8449);
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            outline: none;
        }

        .circle-btn:active {
            transform: scale(0.92);
        }

        .btn-text {
            font-size: 10px;
            margin-top: 3px;
            color: #f1c40f;
            font-weight: bold;
        }

        #urgentAlert {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.8);
            z-index: 150;
            animation: urgentPulse 0.5s infinite alternate;
            text-align: center;
            border: 2px solid #fff;
            width: 80%;
        }

        @keyframes urgentPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.08); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal h2 {
            color: #f1c40f;
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal p {
            font-size: 13px;
            margin: 5px 0 15px 0;
            color: #ecf0f1;
            text-align: center;
            line-height: 1.4;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid #f1c40f;
            padding: 10px 14px;
            border-radius: 4px;
            font-style: italic;
            margin-bottom: 15px;
            max-width: 300px;
        }

        .btn-main {
            background: linear-gradient(180deg, #f1c40f 0%, #d4ac0d 100%);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: confettiFall 2.5s ease-out infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">🀄 MAHJONG MASTER VENÜS 🀄</div>
        <div class="stats-bar">
            <div class="stats-item">Seviye: <span id="level">1</span>/50</div>
            <div class="stats-item">Puan: <span id="score">0</span></div>
            <div class="stats-item">Süre: <span id="timer">120</span>s</div>
            <div class="stats-item">Kalan: <span id="remaining">0</span></div>
        </div>
    </header>

    <div class="board-wrapper" id="board">
        <div id="urgentAlert">⚠️ DİKKAT! SÜRE BİTİYOR! ⚠️</div>
    </div>

    <div class="controls">
        <div class="action-group">
            <button class="circle-btn" onclick="shuffleTiles()">🔀</button>
            <div class="btn-text">Karıştır (<span id="shuffleCount">10</span>)</div>
        </div>
        <div class="action-group">
            <button class="circle-btn" onclick="showHint()">💡</button>
            <div class="btn-text">İpucu (<span id="hintCount">10</span>)</div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <h2>Bölüm Tamamlandı! 🎉</h2>
        <p id="winMessage">Süre Bonusu Ekleniyor...</p>
        <div class="quote-box" id="quoteText">"Hafıza, zekanın hazinesidir."</div>
        <button class="btn-main" onclick="nextLevel()">Sonraki Seviye ➡️</button>
    </div>

    <div class="modal" id="loseModal">
        <h2 id="loseTitle" style="color: #e74c3c;">Süre Bitti! ⏳</h2>
        <p id="loseMessage">Tekrar denemek ister misin?</p>
        <button class="btn-main" onclick="resetCurrentLevel()">Yeniden Başla 🔄</button>
    </div>

    <script>
        const standardSymbols = [
            { main: '中', sub: '萬', color: '#c0392b', name: 'Red Dragon' },
            { main: '發', sub: '萬', color: '#27ae60', name: 'Green Dragon' },
            { main: '東', sub: '風', color: '#c0392b', name: 'East Wind' },
            { main: '南', sub: '風', color: '#2980b9', name: 'South Wind' },
            { main: '西', sub: '風', color: '#27ae60', name: 'West Wind' },
            { main: '北', sub: '風', color: '#d35400', name: 'North Wind' },
            { main: '一', sub: '萬', color: '#27ae60', name: '1 Char' },
            { main: '二', sub: '萬', color: '#c0392b', name: '2 Char' },
            { main: '三', sub: '萬', color: '#8e44ad', name: '3 Char' },
            { main: '九', sub: '萬', color: '#16a085', name: '9 Char' },
            { main: '四', sub: '萬', color: '#e67e22', name: '4 Char' },
            { main: '五', sub: '萬', color: '#2980b9', name: '5 Char' }
        ];

        const animalSymbols = [
            { main: '🐱', sub: 'Kedi', color: '#e67e22', name: 'Animal Cat' },
            { main: '🐶', sub: 'Köpek', color: '#d35400', name: 'Animal Dog' },
            { main: '🦁', sub: 'Aslan', color: '#f1c40f', name: 'Animal Lion' },
            { main: '🐼', sub: 'Panda', color: '#2c3e50', name: 'Animal Panda' },
            { main: '🐰', sub: 'Tavşan', color: '#e84393', name: 'Animal Rabbit' },
            { main: '🦊', sub: 'Tilki', color: '#e17055', name: 'Animal Fox' },
            { main: '🐸', sub: 'Kurbağa', color: '#00b894', name: 'Animal Frog' },
            { main: '🐵', sub: 'Maymun', color: '#d63031', name: 'Animal Monkey' },
            { main: '🐨', sub: 'Koala', color: '#636e72', name: 'Animal Koala' },
            { main: '🐯', sub: 'Kaplan', color: '#e17055', name: 'Animal Tiger' },
            { main: '🐧', sub: 'Penguen', color: '#0984e3', name: 'Animal Penguin' },
            { main: '🦉', sub: 'Baykuş', color: '#6c5ce7', name: 'Animal Owl' }
        ];

        const memoryQuotes = [
            "\"Hafıza, aklın kütüphanesidir; onu düzenli tutmak zihni berraklaştırır.\"",
            "\"Geçmişin izlerini saklayan hafıza, geleceğin en güvenli rehberidir.\"",
            "\"Güçlü bir hafıza, öğrenmenin ve keşfetmenin en sadık dostudur.\"",
            "\"Zihinsel egzersizler, düşünce dünyamıza taze bir nefes kazandırır.\"",
            "\"Her bulmaca çözümü, beyin hücreleri arasında kurulan yeni bir köprüdür.\"",
            "\"Deneyimlerin ve anıların toplamıdır bizi biz yapan.\"",
            "\"Odaklanma ve dikkat, hafızanın kapılarını aralayan iki anahtardır.\""
        ];

        // Garantili ve düzgün görünen sabit şablonlar havuzu (farklı taş sayılarına göre)
        const layoutsPool = [
            // Küçük şablon (16 taş / 8 çift - Seviye 1 için)
            [
                {x: 80, y: 50, l: 0}, {x: 130, y: 50, l: 0}, {x: 180, y: 50, l: 0}, {x: 230, y: 50, l: 0},
                {x: 80, y: 130, l: 0}, {x: 130, y: 130, l: 0}, {x: 180, y: 130, l: 0}, {x: 230, y: 130, l: 0},
                {x: 80, y: 210, l: 0}, {x: 130, y: 210, l: 0}, {x: 180, y: 210, l: 0}, {x: 230, y: 210, l: 0},
                {x: 105, y: 90, l: 1}, {x: 155, y: 90, l: 1}, {x: 105, y: 170, l: 1}, {x: 155, y: 170, l: 1}
            ],
            // Orta şablon (36 taş / 18 çift)
            [
                {x: 50, y: 30, l: 0}, {x: 100, y: 30, l: 0}, {x: 150, y: 30, l: 0}, {x: 200, y: 30, l: 0}, {x: 250, y: 30, l: 0},
                {x: 50, y: 100, l: 0}, {x: 100, y: 100, l: 0}, {x: 150, y: 100, l: 0}, {x: 200, y: 100, l: 0}, {x: 250, y: 100, l: 0},
                {x: 50, y: 170, l: 0}, {x: 100, y: 170, l: 0}, {x: 150, y: 170, l: 0}, {x: 200, y: 170, l: 0}, {x: 250, y: 170, l: 0},
                {x: 50, y: 240, l: 0}, {x: 100, y: 240, l: 0}, {x: 150, y: 240, l: 0}, {x: 200, y: 240, l: 0}, {x: 250, y: 240, l: 0},
                // Kat 1
                {x: 75, y: 65, l: 1}, {x: 125, y: 65, l: 1}, {x: 175, y: 65, l: 1}, {x: 225, y: 65, l: 1},
                {x: 75, y: 135, l: 1}, {x: 125, y: 135, l: 1}, {x: 175, y: 135, l: 1}, {x: 225, y: 135, l: 1},
                {x: 75, y: 205, l: 1}, {x: 125, y: 205, l: 1}, {x: 175, y: 205, l: 1}, {x: 225, y: 205, l: 1},
                // Kat 2
                {x: 100, y: 100, l: 2}, {x: 150, y: 100, l: 2}, {x: 100, y: 170, l: 2}, {x: 150, y: 170, l: 2}
            ]
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedTile = null;
        let remainingTiles = 0;
        let tilesData = [];
        let lockBoard = false;
        let timerInterval = null;
        let timeLeft = 120;

        let shuffleLeft = 10;
        let hintLeft = 10;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = Math.max(45, 120 - (currentLevel * 1.2));
            document.getElementById('timer').innerText = Math.floor(timeLeft);
            document.getElementById('urgentAlert').style.display = 'none';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = Math.floor(timeLeft);

                if (timeLeft <= 15 && timeLeft > 0) {
                    document.getElementById('urgentAlert').style.display = 'block';
                } else {
                    document.getElementById('urgentAlert').style.display = 'none';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('urgentAlert').style.display = 'none';
                    document.getElementById('loseTitle').innerText = "Süre Bitti! ⏳";
                    document.getElementById('loseMessage').innerText = "Süren tükendi. Tekrar denemek ister misin?";
                    document.getElementById('loseModal').style.display = 'flex';
                }
            }, 1000);
        }

        // İstenen mantık: Her 5 levelde bir çift sayısı 10 artacak şekilde şablon üretici
        function getLayoutForLevel(levelIdx) {
            let pairCount = 8 + Math.floor(levelIdx / 5) * 10; // 1. seviye 8 çift (16 taş), sonra 18, 28...
            let totalNeeded = pairCount * 2;
            if (totalNeeded > 72) totalNeeded = 72; // Ekran sınırları için max sınır

            let base = layoutsPool[levelIdx % layoutsPool.length];
            let layout = [];
            
            // Şablonu istenen çift sayısına uyarlamak için çoğaltıyoruz
            for (let i = 0; i < totalNeeded; i++) {
                let templateNode = base[i % base.length];
                // Hafif offset vererek üst üste binme sorununu engelliyoruz
                let offsetX = (Math.floor(i / base.length) * 10) % 40;
                let offsetY = (Math.floor(i / base.length) * 10) % 40;
                layout.push({
                    x: Math.min(300, templateNode.x + offsetX),
                    y: Math.min(340, templateNode.y + offsetY),
                    l: templateNode.l
                });
            }
            return layout;
        }

        function loadLevel(levelIdx) {
            const board = document.getElementById('board');
            document.getElementById('winModal').style.display = 'none';
            document.getElementById('loseModal').style.display = 'none';
            document.getElementById('urgentAlert').style.display = 'none';
            
            shuffleLeft = 10;
            hintLeft = 10;
            updateControlCounts();

            board.innerHTML = '';
            board.appendChild(document.getElementById('urgentAlert'));
            selectedTile = null;
            lockBoard = false;

            const layout = getLayoutForLevel(levelIdx);
            remainingTiles = layout.length;

            // Her 10 levelde bir bonus etap (10, 20, 30, 40, 50) -> Hayvan simgeleri
            let isBonusStage = ((levelIdx + 1) % 10 === 0);
            let poolToUse = isBonusStage ? animalSymbols : standardSymbols;

            let activeSymbols = [];
            for (let i = 0; i < layout.length / 2; i++) {
                activeSymbols.push(poolToUse[i % poolToUse.length]);
            }

            let deck = [...activeSymbols, ...activeSymbols];
            deck.sort(() => Math.random() - 0.5);

            tilesData = [];

            layout.forEach((pos, idx) => {
                const sym = deck[idx];
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.id = idx;
                tile.dataset.name = sym.name;
                tile.dataset.layer = pos.l;
                tile.style.left = `${pos.x}px`;
                tile.style.top = `${pos.y}px`;

                tile.innerHTML = `
                    <div class="tile-inner">
                        <div class="symbol-text" style="color: ${sym.color}">${sym.main}</div>
                        <div class="symbol-sub" style="color: ${sym.color}">${sym.sub}</div>
                    </div>
                `;

                board.appendChild(tile);

                tilesData.push({
                    id: idx,
                    element: tile,
                    x: pos.x,
                    y: pos.y,
                    layer: pos.l,
                    matched: false
                });

                tile.addEventListener('click', () => handleTileClick(idx));
            });

            updateBlockedTiles();
            updateStats();
            startTimer();
        }

        function updateBlockedTiles() {
            tilesData.forEach(tile => {
                if (tile.matched) return;

                let isBlocked = tilesData.some(other => {
                    if (other.matched) return false;
                    if (other.layer > tile.layer) {
                        let overlapX = Math.abs(other.x - tile.x) < 38;
                        let overlapY = Math.abs(other.y - tile.y) < 50;
                        return overlapX && overlapY;
                    }
                    return false;
                });

                if (isBlocked) {
                    tile.element.classList.add('blocked');
                } else {
                    tile.element.classList.remove('blocked');
                }
            });

            checkGameStuck();
        }

        function checkGameStuck() {
            if (remainingTiles <= 0) return;
            let activeTiles = tilesData.filter(t => !t.matched && !t.element.classList.contains('blocked'));
            let hasPair = false;

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].element.dataset.name === activeTiles[j].element.dataset.name) {
                        hasPair = true;
                        break;
                    }
                }
                if (hasPair) break;
            }

            if (!hasPair) {
                if (shuffleLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('urgentAlert').style.display = 'none';
                    document.getElementById('loseTitle').innerText = "Çözüm Bulunamadı! 🛑";
                    document.getElementById('loseMessage').innerText = "Karıştırma hakların bitti ve tahtada hamle kalmadı! Level baştan başlatılıyor.";
                    document.getElementById('loseModal').style.display = 'flex';
                } else {
                    shuffleLeft--;
                    updateControlCounts();
                    autoExecuteShuffle();
                }
            }
        }

        function handleTileClick(id) {
            if (lockBoard) return;
            const tile = tilesData[id];
            
            if (tile.matched || tile.element.classList.contains('blocked')) return;

            tilesData.forEach(t => t.element.classList.remove('hint-target'));

            if (selectedTile === tile) {
                tile.element.classList.remove('selected');
                selectedTile = null;
                return;
            }

            tile.element.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tile;
            } else {
                if (selectedTile.element.dataset.name === tile.element.dataset.name) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.add('matched');
                        tile.element.classList.add('matched');
                        selectedTile.matched = true;
                        tile.matched = true;

                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;

                        score += 200;
                        remainingTiles -= 2;

                        updateBlockedTiles();
                        updateStats();
                        lockBoard = false;

                        if (remainingTiles === 0) {
                            clearInterval(timerInterval);
                            document.getElementById('urgentAlert').style.display = 'none';
                            let bonus = Math.floor(timeLeft * 15);
                            score += bonus;
                            updateStats();
                            
                            document.getElementById('winMessage').innerText = `Bölüm Başarıyla Tamamlandı! Süre Bonusu: +${bonus} Puan`;
                            
                            let randomQuote = memoryQuotes[Math.floor(Math.random() * memoryQuotes.length)];
                            document.getElementById('quoteText').innerText = randomQuote;

                            createConfetti();
                            setTimeout(() => {
                                document.getElementById('winModal').style.display = 'flex';
                            }, 300);
                        }
                    }, 200);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                    }, 300);
                }
            }
        }

        function shuffleTiles() {
            if (shuffleLeft <= 0) {
                alert("Karıştırma hakkın kalmadı!");
                return;
            }
            shuffleLeft--;
            updateControlCounts();
            autoExecuteShuffle();
        }

        function autoExecuteShuffle() {
            let activeTiles = tilesData.filter(t => !t.matched);
            if (activeTiles.length === 0) return;

            let currentSymbols = activeTiles.map(t => ({
                name: t.element.dataset.name,
                html: t.element.querySelector('.tile-inner').innerHTML
            }));

            currentSymbols.sort(() => Math.random() - 0.5);

            activeTiles.forEach((tile, idx) => {
                tile.element.dataset.name = currentSymbols[idx].name;
                tile.element.querySelector('.tile-inner').innerHTML = currentSymbols[idx].html;
            });

            if (selectedTile) {
                selectedTile.element.classList.remove('selected');
                selectedTile = null;
            }
            updateBlockedTiles();
        }

        function showHint() {
            if (hintLeft <= 0) {
                alert("İpucu hakkın kalmadı!");
                return;
            }
            hintLeft--;
            updateControlCounts();

            let activeTiles = tilesData.filter(t => !t.matched && !t.element.classList.contains('blocked'));
            let pairFound = null;

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].element.dataset.name === activeTiles[j].element.dataset.name) {
                        pairFound = [activeTiles[i], activeTiles[j]];
                        break;
                    }
                }
                if (pairFound) break;
            }

            if (pairFound) {
                pairFound[0].element.classList.add('hint-target');
                pairFound[1].element.classList.add('hint-target');

                setTimeout(() => {
                    pairFound[0].element.classList.remove('hint-target');
                    pairFound[1].element.classList.remove('hint-target');
                }, 2000);
            } else {
                shuffleTiles();
            }
        }

        function updateControlCounts() {
            document.getElementById('shuffleCount').innerText = shuffleLeft;
            document.getElementById('hintCount').innerText = hintLeft;
        }

        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6'];
            for(let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 2500);
            }
        }

        function resetCurrentLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= 50) {
                currentLevel = 0;
                alert("Tebrikler! 50 levelin tümünü başarıyla tamamladın!");
            }
            loadLevel(currentLevel);
        }

        function updateStats() {
            document.getElementById('level').innerText = currentLevel + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('remaining').innerText = Math.max(0, remainingTiles);
        }

        loadLevel(currentLevel);
    </script>
</body>
</html>
