<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Mahjong Game</title>
  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c3e50;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h1 { color: #f1c40f; margin-bottom: 5px; }
    p { font-size: 14px; color: #bdc3c7; }
    #stats {
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 360px;
      margin: 0 auto;
    }
    .tile {
      background: #ecf0f1;
      color: #2c3e50;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px #bdc3c7;
      transition: transform 0.1s, background-color 0.2s;
    }
    .tile.active {
      background: #3498db;
      color: #fff;
      transform: scale(0.95);
    }
    .tile.matched {
      visibility: hidden;
    }
    button {
      background-color: #8e44ad;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background-color: #9b59b6; }
  </style>
</head>
<body>

  <h1>Pi Mahjong</h1>
  <p>Aynı simgeye sahip taşları eşleştirip tahtayı temizleyin!</p>

  <div id="stats">
    Puan: <span id="score">0</span> | Hamle: <span id="moves">0</span>
  </div>

  <div class="grid" id="board"></div>

  <button onclick="initGame()">Yeniden Başlat</button>

  <script>
    // Pi Network SDK Başlatma
    const Pi = window.Pi;
    if (Pi) {
      Pi.init({ version: "2.0", sandbox: true }); // Testnet için sandbox: true
    }

    const symbols = ['🀄', '🀅', '🀆', '🀇', '🀈', '🀉', '🀊', '🀋'];
    let deck = [...symbols, ...symbols];
    let selectedTiles = [];
    let moves = 0;
    let score = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      selectedTiles = [];
      moves = 0;
      score = 0;
      document.getElementById('moves').innerText = moves;
      document.getElementById('score').innerText = score;

      const shuffled = shuffle([...deck]);
      shuffled.forEach((symbol, index) => {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.dataset.symbol = symbol;
        tile.dataset.index = index;
        tile.innerText = '🀁'; // Kapalı simge
        tile.addEventListener('click', handleTileClick);
        board.appendChild(tile);
      });
    }

    function handleTileClick(e) {
      const tile = e.currentTarget;
      
      if (tile.classList.contains('active') || tile.classList.contains('matched') || selectedTiles.length === 2) {
        return;
      }

      tile.innerText = tile.dataset.symbol;
      tile.classList.add('active');
      selectedTiles.push(tile);

      if (selectedTiles.length === 2) {
        moves++;
        document.getElementById('moves').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [tile1, tile2] = selectedTiles;

      if (tile1.dataset.symbol === tile2.dataset.symbol) {
        setTimeout(() => {
          tile1.classList.add('matched');
          tile2.classList.add('matched');
          selectedTiles = [];
          score += 10;
          document.getElementById('score').innerText = score;

          // Oyun bitti mi kontrol et
          if (document.querySelectorAll('.tile.matched').length === deck.length) {
            alert('Tebrikler! Oyunu tamamladınız. Toplam Puan: ' + score);
          }
        }, 500);
      } else {
        setTimeout(() => {
          tile1.innerText = '🀁';
          tile2.innerText = '🀁';
          tile1.classList.remove('active');
          tile2.classList.remove('active');
          selectedTiles = [];
        }, 800);
      }
    }

    // Oyunu Başlat
    initGame();
  </script>
</body>
</html>
