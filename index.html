<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venüs</title>
    <style>
        :root {
            --tile-w: 42px;
            --tile-h: 60px;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            padding: 5px;
            background: radial-gradient(circle, #1a4d2e 0%, #081c11 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2px;
            width: 100%;
            max-width: 380px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 35, 20, 0.9);
            padding: 6px 8px;
            border-radius: 20px;
            border: 1px solid rgba(241, 196, 15, 0.4);
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .stats-item span {
            color: #f1c40f;
            font-size: 12px;
        }

        .board-wrapper {
            position: relative;
            width: 355px;
            height: 385px;
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 15px;
            border: 3px solid rgba(241, 196, 15, 0.25);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(6, var(--tile-w));
            gap: 5px;
            justify-content: center;
            align-content: center;
            max-height: 100%;
            overflow-y: auto;
        }

        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.25s ease;
            box-sizing: border-box;
            border: 1px solid #dcdcdc;
            box-shadow: 2px 3px 5px var(--shadow-color), 0 4px 0 #b0bec5;
        }

        .tile-inner {
            width: 82%;
            height: 86%;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.08);
        }

        .tile .symbol-text {
            font-size: 19px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
        }

        .tile .symbol-sub {
            font-size: 8px;
            margin-top: 2px;
            font-weight: bold;
            opacity: 0.85;
        }

        .tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 15px #f1c40f, 0 4px 0 #d4ac0d !important;
            transform: translateY(-4px) scale(1.05);
            z-index: 99;
        }

        .tile.hint-target {
            animation: pulseHint 0.6s infinite alternate;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 15px #2ecc71 !important;
        }

        @keyframes pulseHint {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .tile.matched {
            opacity: 0;
            transform: scale(0.0) rotate(15deg) !important;
            pointer-events: none;
        }

        .controls {
            margin-top: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            background: linear-gradient(145deg, #27ae60, #1e8449);
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            outline: none;
        }

        .circle-btn:active {
            transform: scale(0.92);
        }

        .btn-text {
            font-size: 10px;
            margin-top: 3px;
            color: #f1c40f;
            font-weight: bold;
        }

        #urgentAlert {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.8);
            z-index: 150;
            text-align: center;
            border: 2px solid #fff;
            width: 75%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal h2 {
            color: #f1c40f;
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal p {
            font-size: 12px;
            margin: 5px 0 15px 0;
            color: #ecf0f1;
            text-align: center;
            line-height: 1.4;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid #f1c40f;
            padding: 8px 12px;
            border-radius: 4px;
            font-style: italic;
            margin-bottom: 12px;
            max-width: 280px;
            font-size: 11px;
        }

        .btn-main {
            background: linear-gradient(180deg, #f1c40f 0%, #d4ac0d 100%);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: confettiFall 2.5s ease-out infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">🀄 MAHJONG MASTER VENÜS 🀄</div>
        <div class="stats-bar">
            <div class="stats-item">Seviye: <span id="level">1</span>/50</div>
            <div class="stats-item">Puan: <span id="score">0</span></div>
            <div class="stats-item">Süre: <span id="timer">120</span>s</div>
            <div class="stats-item">Kalan: <span id="remaining">0</span></div>
        </div>
    </header>

    <div class="board-wrapper" id="boardWrapper">
        <div id="urgentAlert">⚠️ DİKKAT! SÜRE BİTİYOR! ⚠️</div>
        <div class="tiles-grid" id="tilesGrid"></div>
    </div>

    <div class="controls">
        <div class="action-group">
            <button class="circle-btn" onclick="shuffleTiles()">🔀</button>
            <div class="btn-text">Karıştır (<span id="shuffleCount">10</span>)</div>
        </div>
        <div class="action-group">
            <button class="circle-btn" onclick="showHint()">💡</button>
            <div class="btn-text">İpucu (<span id="hintCount">10</span>)</div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <h2>Bölüm Tamamlandı! 🎉</h2>
        <p id="winMessage">Süre Bonusu Ekleniyor...</p>
        <div class="quote-box" id="quoteText">"Hafıza, zekanın hazinesidir."</div>
        <button class="btn-main" onclick="nextLevel()">Sonraki Seviye ➡️</button>
    </div>

    <div class="modal" id="loseModal">
        <h2 id="loseTitle" style="color: #e74c3c;">Süre Bitti! ⏳</h2>
        <p id="loseMessage">Tekrar denemek ister misin?</p>
        <button class="btn-main" onclick="resetCurrentLevel()">Yeniden Başla 🔄</button>
    </div>

    <script>
        const standardSymbols = [
            { main: '中', sub: '萬', color: '#c0392b', name: 'Red Dragon' },
            { main: '發', sub: '萬', color: '#27ae60', name: 'Green Dragon' },
            { main: '東', sub: '風', color: '#c0392b', name: 'East Wind' },
            { main: '南', sub: '風', color: '#2980b9', name: 'South Wind' },
            { main: '西', sub: '風', color: '#27ae60', name: 'West Wind' },
            { main: '北', sub: '風', color: '#d35400', name: 'North Wind' },
            { main: '一', sub: '萬', color: '#27ae60', name: '1 Char' },
            { main: '二', sub: '萬', color: '#c0392b', name: '2 Char' },
            { main: '三', sub: '萬', color: '#8e44ad', name: '3 Char' },
            { main: '九', sub: '萬', color: '#16a085', name: '9 Char' },
            { main: '四', sub: '萬', color: '#e67e22', name: '4 Char' },
            { main: '五', sub: '萬', color: '#2980b9', name: '5 Char' }
        ];

        const animalSymbols = [
            { main: '🐱', sub: 'Kedi', color: '#e67e22', name: 'Animal Cat' },
            { main: '🐶', sub: 'Köpek', color: '#d35400', name: 'Animal Dog' },
            { main: '🦁', sub: 'Aslan', color: '#f1c40f', name: 'Animal Lion' },
            { main: '🐼', sub: 'Panda', color: '#2c3e50', name: 'Animal Panda' },
            { main: '🐰', sub: 'Tavşan', color: '#e84393', name: 'Animal Rabbit' },
            { main: '🦊', sub: 'Tilki', color: '#e17055', name: 'Animal Fox' },
            { main: '🐸', sub: 'Kurbağa', color: '#00b894', name: 'Animal Frog' },
            { main: '🐵', sub: 'Maymun', color: '#d63031', name: 'Animal Monkey' },
            { main: '🐨', sub: 'Koala', color: '#636e72', name: 'Animal Koala' },
            { main: '🐯', sub: 'Kaplan', color: '#e17055', name: 'Animal Tiger' },
            { main: '🐧', sub: 'Penguen', color: '#0984e3', name: 'Animal Penguin' },
            { main: '🦉', sub: 'Baykuş', color: '#6c5ce7', name: 'Animal Owl' }
        ];

        const memoryQuotes = [
            "\"Hafıza, aklın kütüphanesidir; onu düzenli tutmak zihni berraklaştırır.\"",
            "\"Geçmişin izlerini saklayan hafıza, geleceğin en güvenli rehberidir.\"",
            "\"Güçlü bir hafıza, öğrenmenin ve keşfetmenin en sadık dostudur.\"",
            "\"Zihinsel egzersizler, düşünce dünyamıza taze bir nefes kazandırır.\"",
            "\"Her bulmaca çözümü, beyin hücreleri arasında kurulan yeni bir köprüdür.\"",
            "\"Deneyimlerin ve anıların toplamıdır bizi biz yapan.\"",
            "\"Odaklanma ve dikkat, hafızanın kapılarını aralayan iki anahtardır.\""
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedTile = null;
        let remainingTiles = 0;
        let tilesData = [];
        let lockBoard = false;
        let timerInterval = null;
        let timeLeft = 120;

        let shuffleLeft = 10;
        let hintLeft = 10;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = Math.max(45, 120 - (currentLevel * 1.2));
            document.getElementById('timer').innerText = Math.floor(timeLeft);
            document.getElementById('urgentAlert').style.display = 'none';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = Math.floor(timeLeft);

                if (timeLeft <= 15 && timeLeft > 0) {
                    document.getElementById('urgentAlert').style.display = 'block';
                } else {
                    document.getElementById('urgentAlert').style.display = 'none';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('urgentAlert').style.display = 'none';
                    document.getElementById('loseTitle').innerText = "Süre Bitti! ⏳";
                    document.getElementById('loseMessage').innerText = "Süren tükendi. Tekrar denemek ister misin?";
                    document.getElementById('loseModal').style.display = 'flex';
                }
            }, 1000);
        }

        function loadLevel(levelIdx) {
            const grid = document.getElementById('tilesGrid');
            document.getElementById('winModal').style.display = 'none';
            document.getElementById('loseModal').style.display = 'none';
            document.getElementById('urgentAlert').style.display = 'none';
            
            shuffleLeft = 10;
            hintLeft = 10;
            updateControlCounts();

            grid.innerHTML = '';
            selectedTile = null;
            lockBoard = false;

            // Her 5 levelde bir çift sayısı 10 artar (12 taş, 22 taş, 32 taş...)
            let pairCount = 6 + Math.floor(levelIdx / 5) * 5; 
            let totalNeeded = pairCount * 2;
            if (totalNeeded > 36) totalNeeded = 36; // Grid ekranına sığacak ideal max taş

            remainingTiles = totalNeeded;

            let isBonusStage = ((levelIdx + 1) % 10 === 0);
            let poolToUse = isBonusStage ? animalSymbols : standardSymbols;

            let activeSymbols = [];
            for (let i = 0; i < totalNeeded / 2; i++) {
                activeSymbols.push(poolToUse[i % poolToUse.length]);
            }

            let deck = [...activeSymbols, ...activeSymbols];
            deck.sort(() => Math.random() - 0.5);

            tilesData = [];

            deck.forEach((sym, idx) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.id = idx;
                tile.dataset.name = sym.name;

                tile.innerHTML = `
                    <div class="tile-inner">
                        <div class="symbol-text" style="color: ${sym.color}">${sym.main}</div>
                        <div class="symbol-sub" style="color: ${sym.color}">${sym.sub}</div>
                    </div>
                `;

                grid.appendChild(tile);

                tilesData.push({
                    id: idx,
                    element: tile,
                    matched: false
                });

                tile.addEventListener('click', () => handleTileClick(idx));
            });

            updateStats();
            startTimer();
        }

        function handleTileClick(id) {
            if (lockBoard) return;
            const tile = tilesData[id];
            
            if (tile.matched) return;

            tilesData.forEach(t => t.element.classList.remove('hint-target'));

            if (selectedTile === tile) {
                tile.element.classList.remove('selected');
                selectedTile = null;
                return;
            }

            tile.element.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tile;
            } else {
                if (selectedTile.element.dataset.name === tile.element.dataset.name && selectedTile.id !== tile.id) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.add('matched');
                        tile.element.classList.add('matched');
                        selectedTile.matched = true;
                        tile.matched = true;

                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;

                        score += 200;
                        remainingTiles -= 2;

                        updateStats();
                        lockBoard = false;

                        if (remainingTiles === 0) {
                            clearInterval(timerInterval);
                            document.getElementById('urgentAlert').style.display = 'none';
                            let bonus = Math.floor(timeLeft * 15);
                            score += bonus;
                            updateStats();
                            
                            document.getElementById('winMessage').innerText = `Bölüm Başarıyla Tamamlandı! Süre Bonusu: +${bonus} Puan`;
                            
                            let randomQuote = memoryQuotes[Math.floor(Math.random() * memoryQuotes.length)];
                            document.getElementById('quoteText').innerText = randomQuote;

                            createConfetti();
                            setTimeout(() => {
                                document.getElementById('winModal').style.display = 'flex';
                            }, 300);
                        }
                    }, 200);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.remove('selected');
                        tile.element.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                    }, 300);
                }
            }
        }

        function shuffleTiles() {
            if (shuffleLeft <= 0) {
                alert("Karıştırma hakkın kalmadı!");
                return;
            }
            shuffleLeft--;
            updateControlCounts();

            let activeTiles = tilesData.filter(t => !t.matched);
            if (activeTiles.length === 0) return;

            let currentSymbols = activeTiles.map(t => ({
                name: t.element.dataset.name,
                html: t.element.querySelector('.tile-inner').innerHTML
            }));

            currentSymbols.sort(() => Math.random() - 0.5);

            activeTiles.forEach((tile, idx) => {
                tile.element.dataset.name = currentSymbols[idx].name;
                tile.element.querySelector('.tile-inner').innerHTML = currentSymbols[idx].html;
            });

            if (selectedTile) {
                selectedTile.element.classList.remove('selected');
                selectedTile = null;
            }
        }

        function showHint() {
            if (hintLeft <= 0) {
                alert("İpucu hakkın kalmadı!");
                return;
            }
            hintLeft--;
            updateControlCounts();

            let activeTiles = tilesData.filter(t => !t.matched);
            let pairFound = null;

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].element.dataset.name === activeTiles[j].element.dataset.name) {
                        pairFound = [activeTiles[i], activeTiles[j]];
                        break;
                    }
                }
                if (pairFound) break;
            }

            if (pairFound) {
                pairFound[0].element.classList.add('hint-target');
                pairFound[1].element.classList.add('hint-target');

                setTimeout(() => {
                    pairFound[0].element.classList.remove('hint-target');
                    pairFound[1].element.classList.remove('hint-target');
                }, 2000);
            }
        }

        function updateControlCounts() {
            document.getElementById('shuffleCount').innerText = shuffleLeft;
            document.getElementById('hintCount').innerText = hintLeft;
        }

        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6'];
            for(let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 2500);
            }
        }

        function resetCurrentLevel() {
            loadLevel(currentLevel);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= 50) {
                currentLevel = 0;
                alert("Tebrikler! 50 levelin tümünü başarıyla tamamladın!");
            }
            loadLevel(currentLevel);
        }

        function updateStats() {
            document.getElementById('level').innerText = currentLevel + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('remaining').innerText = Math.max(0, remainingTiles);
        }

        loadLevel(currentLevel);
    </script>
</body>
</html>
