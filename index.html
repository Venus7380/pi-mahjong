<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venus</title>
    <style>
        :root {
            --tile-bg: linear-gradient(145deg, #ffffff, #f0f0f0);
            --shadow: 0 6px 10px rgba(0,0,0,0.4);
            --selected-glow: 0 0 15px #ffd700;
        }

        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle, #1b5e20 0%, #082816 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            margin: 5px 0;
            color: #ffd700;
            font-size: 26px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            font-weight: bold;
            font-size: 14px;
        }

        .stats-item span {
            color: #ffd700;
        }

        .board-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tile {
            aspect-ratio: 3 / 4;
            background: var(--tile-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 0 #b0bec5, var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid #ddd;
        }

        .tile:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b0bec5, var(--shadow);
        }

        .tile.selected {
            transform: translateY(-6px);
            box-shadow: var(--selected-glow), 0 8px 0 #b0bec5;
            border: 2px solid #ffd700;
        }

        .tile.matched {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.5);
            transition: all 0.3s ease;
        }

        .tile .symbol-icon {
            font-size: 38px;
            line-height: 1;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
        }

        .tile .label {
            font-size: 11px;
            color: #2c3e50;
            margin-top: 4px;
            font-weight: 800;
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(180deg, #ffb300 0%, #ff8f00 100%);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .win-modal h2 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mahjong Master</h1>
        <div class="stats-bar">
            <div class="stats-item">Puan: <span id="score">0</span></div>
            <div class="stats-item">Hamle: <span id="moves">0</span></div>
            <div class="stats-item">Kalan: <span id="remaining">16</span></div>
        </div>
    </header>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="initGame()">Yeniden Başlat</button>
    </div>

    <div class="win-modal" id="winModal">
        <h2>Tebrikler! 🎉</h2>
        <p>Tahtayı başarıyla temizlediniz.</p>
        <button class="btn" onclick="initGame()">Tekrar Oyna</button>
    </div>

    <script>
        const symbols = [
            { icon: '🀀', name: 'Doğu', color: '#d32f2f' },
            { icon: '🀁', name: 'Güney', color: '#1976d2' },
            { icon: '🀂', name: 'Batı', color: '#388e3c' },
            { icon: '🀃', name: 'Kuzey', color: '#f57c00' },
            { icon: '🀄', name: 'Ejder', color: '#c2185b' },
            { icon: '🀅', name: 'Bambu', color: '#2e7d32' },
            { icon: '🀆', name: 'Beyaz', color: '#7b1fa2' },
            { icon: '🀇', name: '1 Karakter', color: '#00796b' }
        ];

        let selectedTile = null;
        let score = 0;
        let moves = 0;
        let remaining = 16;
        let lockBoard = false;

        function initGame() {
            const board = document.getElementById('board');
            document.getElementById('winModal').style.display = 'none';
            board.innerHTML = '';
            selectedTile = null;
            score = 0;
            moves = 0;
            remaining = 16;
            lockBoard = false;
            
            updateStats();

            let deck = [...symbols, ...symbols];
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((data, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.dataset.symbol = data.name;
                tile.dataset.index = index;

                tile.innerHTML = `
                    <div class="symbol-icon" style="color: ${data.color}">${data.icon}</div>
                    <div class="label">${data.name}</div>
                `;

                tile.addEventListener('click', () => handleTileClick(tile));
                board.appendChild(tile);
            });
        }

        function handleTileClick(tile) {
            if (lockBoard || tile.classList.contains('matched') || tile === selectedTile) return;

            tile.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tile;
            } else {
                moves++;
                if (selectedTile.dataset.symbol === tile.dataset.symbol) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.classList.add('matched');
                        tile.classList.add('matched');
                        selectedTile.classList.remove('selected');
                        tile.classList.remove('selected');
                        selectedTile = null;
                        score += 100;
                        remaining -= 2;
                        updateStats();
                        lockBoard = false;

                        if (remaining === 0) {
                            document.getElementById('winModal').style.display = 'flex';
                        }
                    }, 300);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.classList.remove('selected');
                        tile.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                        updateStats();
                    }, 500);
                }
            }
        }

        function updateStats() {
            document.getElementById('score').innerText = score;
            document.getElementById('moves').innerText = moves;
            document.getElementById('remaining').innerText = remaining;
        }

        initGame();
    </script>
</body>
</html>
