<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master Venüs</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #113822;
            font-family: Tahoma, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        h1 {
            font-size: 16px;
            color: #f1c40f;
            margin: 5px 0 10px 0;
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 15px;
            background: #1b5e36;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #f1c40f;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 8px;
            background: #0d2818;
            padding: 15px;
            border-radius: 12px;
            border: 3px solid #f1c40f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }

        .tile {
            width: 60px;
            height: 80px;
            background: #fdfdfd;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #ccc;
            box-shadow: 0 4px 0 #999;
            color: #333;
            font-weight: bold;
        }

        .tile.selected {
            border-color: #f1c40f;
            background: #fff9c4;
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #d4ac0d;
        }

        .tile.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .tile.blocked {
            filter: brightness(0.4);
            cursor: not-allowed;
        }

        .symbol {
            font-size: 22px;
            line-height: 1;
        }

        .sub {
            font-size: 9px;
            margin-top: 4px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        button {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b7950b;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b7950b;
        }
    </style>
</head>
<body>

    <h1>🀄 MAHJONG MASTER VENÜS 🀄</h1>
    
    <div class="stats">
        <div>Seviye: <span id="level">1</span></div>
        <div>Puan: <span id="score">0</span></div>
        <div>Süre: <span id="timer">120</span>s</div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button onclick="shuffleTiles()">Karıştır</button>
        <button onclick="showHint()">İpucu</button>
    </div>

    <script>
        const symbols = [
            { main: '1', sub: 'Bir', color: '#c0392b' },
            { main: '2', sub: 'İki', color: '#e67e22' },
            { main: '3', sub: 'Üç', color: '#f1c40f' },
            { main: '4', sub: 'Dört', color: '#27ae60' },
            { main: '5', sub: 'Beş', color: '#2980b9' },
            { main: '6', sub: 'Altı', color: '#8e44ad' },
            { main: '7', sub: 'Yedi', color: '#16a085' },
            { main: '8', sub: 'Sekiz', color: '#d35400' },
            { main: '9', sub: 'Dokuz', color: '#c0392b' },
            { main: '10', sub: 'On', color: '#2c3e50' }
        ];

        let currentLevel = 1;
        let score = 0;
        let timeLeft = 120;
        let timerInterval = null;
        let tilesData = [];
        let selectedTile = null;
        let lockBoard = false;

        function startGame() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            selectedTile = null;
            lockBoard = false;

            // 10 çift = 20 taş (5 sütun x 4 satırlık kusursuz grid)
            let deckSymbols = [...symbols, ...symbols];
            deckSymbols.sort(() => Math.random() - 0.5);

            tilesData = [];

            deckSymbols.forEach((sym, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                // İlk 10 taş üst katman, sonrakiler alt katman simülasyonu
                tile.dataset.layer = idx < 10 ? 1 : 0;
                tile.dataset.symbol = sym.main;

                tile.innerHTML = `
                    <div class="symbol" style="color: ${sym.color}">${sym.main}</div>
                    <div class="sub">${sym.sub}</div>
                `;

                tile.addEventListener('click', () => handleTileClick(idx));
                board.appendChild(tile);

                tilesData.push({
                    id: idx,
                    element: tile,
                    symbol: sym.main,
                    layer: parseInt(tile.dataset.layer),
                    matched: false
                });
            });

            updateBlocked();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 120;
            document.getElementById('timer').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Süre bitti! Yeniden başlatılıyor.");
                    startGame();
                }
            }, 1000);
        }

        function updateBlocked() {
            // Alt katmandaki taşlar (idx 10-19), üst katmandaki eşleri (idx 0-9) silinene kadar kilitli
            tilesData.forEach((tile, idx) => {
                if (tile.matched) return;
                if (idx >= 10) {
                    let upperIdx = idx - 10;
                    if (!tilesData[upperIdx].matched) {
                        tile.element.classList.add('blocked');
                    } else {
                        tile.element.classList.remove('blocked');
                    }
                } else {
                    tile.element.classList.remove('blocked');
                }
            });
        }

        function handleTileClick(idx) {
            if (lockBoard) return;
            let tileObj = tilesData[idx];

            if (tileObj.matched || tileObj.element.classList.contains('blocked')) return;

            if (selectedTile === tileObj) {
                tileObj.element.classList.remove('selected');
                selectedTile = null;
                return;
            }

            tileObj.element.classList.add('selected');

            if (!selectedTile) {
                selectedTile = tileObj;
            } else {
                if (selectedTile.symbol === tileObj.symbol && selectedTile.id !== tileObj.id) {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.add('matched');
                        tileObj.element.classList.add('matched');
                        selectedTile.matched = true;
                        tileObj.matched = true;

                        selectedTile.element.classList.remove('selected');
                        tileObj.element.classList.remove('selected');
                        selectedTile = null;

                        score += 100;
                        document.getElementById('score').innerText = score;

                        updateBlocked();
                        lockBoard = false;

                        // Kazanma kontrolü
                        if (tilesData.every(t => t.matched)) {
                            clearInterval(timerInterval);
                            alert("Tebrikler Bölümü Tamamladın! 🎉");
                            currentLevel++;
                            document.getElementById('level').innerText = currentLevel;
                            startGame();
                        }
                    }, 200);
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        selectedTile.element.classList.remove('selected');
                        tileObj.element.classList.remove('selected');
                        selectedTile = null;
                        lockBoard = false;
                    }, 300);
                }
            }
        }

        function shuffleTiles() {
            let activeTiles = tilesData.filter(t => !t.matched);
            let symbolsList = activeTiles.map(t => t.symbol);
            symbolsList.sort(() => Math.random() - 0.5);

            activeTiles.forEach((t, i) => {
                t.symbol = symbolsList[i];
                t.element.dataset.symbol = symbolsList[i];
                t.element.querySelector('.symbol').innerText = symbolsList[i];
                t.element.querySelector('.sub').innerText = 'Num ' + symbolsList[i];
            });

            if (selectedTile) {
                selectedTile.element.classList.remove('selected');
                selectedTile = null;
            }
        }

        function showHint() {
            let active = tilesData.filter(t => !t.matched && !t.element.classList.contains('blocked'));
            for (let i = 0; i < active.length; i++) {
                for (let j = i + 1; j < active.label?.length || active.length; j++) {
                    if (active[i] && active[j] && active[i].symbol === active[j].symbol) {
                        alert(`İpucu: ${active[i].symbol} taşları eşleşmeye hazır!`);
                        return;
                    }
                }
            }
        }

        // Oyunu Başlat
        startGame();
    </script>
</body>
</html>
